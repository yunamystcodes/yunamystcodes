name: Fix background music

on:
  push:
    paths:
      - '.github/workflows/add-background-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix mobile background music
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          audio = '<audio id="yunaBgMusic" loop preload="auto" autoplay playsinline src="assets/One%20More%20Scroll.mp3"></audio>'
          s = re.sub(r'<audio id="yunaBgMusic"[^>]*></audio>', audio, s, count=1)

          start = s.find('const bgMusic=document.getElementById("yunaBgMusic");')
          if start == -1:
              raise SystemExit('music script marker not found')
          end = s.find('</script>', start)
          if end == -1:
              raise SystemExit('music script end not found')

          script = '''const bgMusic=document.getElementById("yunaBgMusic");
          const audioMute=document.getElementById("audioMute");
          if(bgMusic&&audioMute){
            const userMuted=()=>localStorage.getItem("yunamyst-music-muted")==="1";
            bgMusic.volume=0.08;
            bgMusic.playsInline=true;
            const syncAudio=()=>{
              const muted=userMuted();
              audioMute.textContent=muted?"🔇":"🔊";
              audioMute.title=muted?"Ativar música":"Mutar música";
              audioMute.setAttribute("aria-label",audioMute.title);
            };
            const playAudio=()=>{
              if(userMuted()) return;
              bgMusic.muted=false;
              bgMusic.volume=0.08;
              const p=bgMusic.play();
              if(p&&typeof p.catch==='function') p.catch(()=>{});
            };
            const tryAutoplay=()=>{
              if(userMuted()) return;
              bgMusic.muted=true;
              const p=bgMusic.play();
              if(p&&typeof p.then==='function') p.then(()=>{
                if(!userMuted()) bgMusic.muted=false;
                bgMusic.volume=0.08;
                syncAudio();
              }).catch(()=>{});
            };
            const unlockAudio=()=>playAudio();
            audioMute.addEventListener("click",e=>{
              e.stopPropagation();
              const nextMuted=!userMuted();
              localStorage.setItem("yunamyst-music-muted",nextMuted?"1":"0");
              bgMusic.muted=nextMuted;
              syncAudio();
              if(!nextMuted) playAudio();
            });
            ["touchstart","pointerdown","click","keydown"].forEach(evt=>{
              document.addEventListener(evt,unlockAudio,{capture:true,passive:true,once:true});
            });
            syncAudio();
            if(document.readyState==="loading"){
              document.addEventListener("DOMContentLoaded",tryAutoplay,{once:true});
            }else{
              tryAutoplay();
            }
          }'''
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          s = s[:start] + script + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No music changes needed."
          else
            git commit -m "Fix mobile background music playback"
            git push
          fi
