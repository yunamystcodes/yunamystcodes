name: Add background music control

on:
  push:
    paths:
      - '.github/workflows/add-background-music.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add music control to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="yunaBgMusic"' not in s:
              s=s.replace('<div class="bg"></div>', '<div class="bg"></div>\n<audio id="yunaBgMusic" loop preload="auto" src="assets/one-more-scroll.mp3"></audio>', 1)
              s=s.replace('.lang-wrap{position:relative}', '.lang-wrap{position:relative;display:flex;align-items:center;gap:8px}', 1)
              css='''
.audio-mute{width:42px;height:42px;border:1px solid #a85cff;border-radius:10px;background:#0c0a18;color:#fff;cursor:pointer;display:grid;place-items:center;font-size:20px;line-height:1;padding:0;box-shadow:0 0 12px rgba(168,92,255,.12)}
.audio-mute:hover{background:#24113d;border-color:#c17cff}
@media(max-width:600px){.audio-mute{width:38px;height:38px;border-radius:9px;font-size:18px}}
'''
              s=s.replace('</style>', css+'</style>', 1)
              old='<div class="lang-wrap"><button class="lang" id="langBtn" type="button">'
              new='<div class="lang-wrap"><button class="audio-mute" id="audioMute" type="button" aria-label="Mutar música" title="Mutar música">🔇</button><button class="lang" id="langBtn" type="button">'
              if old not in s: raise SystemExit('language control not found')
              s=s.replace(old,new,1)
              js='''
const bgMusic=document.getElementById('yunaBgMusic');
const audioMute=document.getElementById('audioMute');
if(bgMusic && audioMute){
  bgMusic.volume=0.08;
  bgMusic.muted=localStorage.getItem('yunamyst-music-muted')==='1';
  const syncAudio=()=>{audioMute.textContent=bgMusic.muted?'🔇':'🔊';audioMute.title=bgMusic.muted?'Ativar música':'Mutar música';audioMute.setAttribute('aria-label',audioMute.title)};
  const tryPlay=()=>{if(!bgMusic.muted) bgMusic.play().catch(()=>{});};
  audioMute.addEventListener('click',e=>{e.stopPropagation();bgMusic.muted=!bgMusic.muted;localStorage.setItem('yunamyst-music-muted',bgMusic.muted?'1':'0');syncAudio();if(!bgMusic.muted) tryPlay();});
  document.addEventListener('pointerdown',tryPlay,{once:true});
  syncAudio();
}
'''
              s=s.replace('</script>', js+'</script>', 1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add background music control"
          git push
