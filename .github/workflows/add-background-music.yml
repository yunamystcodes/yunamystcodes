name: Fix background music and page title

on:
  push:
    paths:
      - '.github/workflows/add-background-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore music autoplay and remove 2026 from heading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the year from the visible page heading and metadata.
          s = re.sub(r'(>\s*CÓDIGOS DE SUMMONERS WAR)\s+2026(\s*<)', r'\1\2', s, flags=re.I)
          s = re.sub(r'(Summoners War)\s+2026(\s*\|)', r'\1\2', s, flags=re.I)
          s = re.sub(r'(Summoners War[^<]*?)\s+2026(,|\.|\s|<)', r'\1\2', s, flags=re.I)

          # Keep the audio element simple and valid for desktop and mobile.
          audio = '<audio id="yunaBgMusic" loop preload="auto" autoplay playsinline src="assets/One%20More%20Scroll.mp3"></audio>'
          s = re.sub(r'<audio id="yunaBgMusic"[^>]*></audio>', audio, s, count=1)

          start = s.find('const bgMusic=document.getElementById("yunaBgMusic");')
          if start == -1:
              raise SystemExit('music script marker not found')
          end = s.find('</script>', start)
          if end == -1:
              raise SystemExit('music script end not found')

          script = '''const bgMusic=document.getElementById("yunaBgMusic");
          const audioMute=document.getElementById("audioMute");
          if(bgMusic&&audioMute){
            const userMuted=()=>localStorage.getItem("yunamyst-music-muted")==="1";
            bgMusic.volume=0.03;
            bgMusic.autoplay=true;
            bgMusic.playsInline=true;

            const syncAudio=()=>{
              const muted=userMuted();
              audioMute.textContent=muted?"🔇":"🔊";
              audioMute.title=muted?"Ativar música":"Mutar música";
              audioMute.setAttribute("aria-label",audioMute.title);
            };

            const playAudio=()=>{
              if(userMuted()) return Promise.resolve(false);
              bgMusic.muted=false;
              bgMusic.volume=0.03;
              return Promise.resolve(bgMusic.play()).then(()=>true).catch(()=>false);
            };

            const attemptAutoplay=()=>{
              if(userMuted()) return;
              bgMusic.muted=false;
              bgMusic.volume=0.03;
              bgMusic.load();
              playAudio().then(ok=>{
                if(ok) syncAudio();
              });
            };

            audioMute.addEventListener("click",e=>{
              e.stopPropagation();
              if(bgMusic.paused){
                localStorage.setItem("yunamyst-music-muted","0");
                playAudio().then(ok=>{ if(ok) syncAudio(); });
                return;
              }
              const nextMuted=!userMuted();
              localStorage.setItem("yunamyst-music-muted",nextMuted?"1":"0");
              bgMusic.muted=nextMuted;
              syncAudio();
              if(!nextMuted) playAudio();
            });

            syncAudio();

            if(document.readyState==="loading"){
              document.addEventListener("DOMContentLoaded",attemptAutoplay,{once:true});
            }else{
              attemptAutoplay();
            }
            window.addEventListener("load",attemptAutoplay,{once:true});
            bgMusic.addEventListener("canplay",attemptAutoplay,{once:true});
            window.addEventListener("pageshow",attemptAutoplay,{once:true});

            /* Browser fallback: if autoplay is blocked, the first ordinary
               interaction starts the music. This is required by browsers that
               prohibit audible autoplay on a fresh page. */
            const unlockOnce=()=>{
              if(userMuted()||!bgMusic.paused) return;
              playAudio().then(ok=>{ if(ok) syncAudio(); });
            };
            ["pointerdown","touchstart","keydown"].forEach(evt=>{
              document.addEventListener(evt,unlockOnce,{capture:true,passive:true});
            });
          }'''
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          s = s[:start] + script + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No site changes needed."
          else
            git commit -m "Reduce mobile background music volume"
            git push
          fi