name: Fix background music

on:
  push:
    paths:
      - '.github/workflows/add-background-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix desktop and mobile background music
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          audio = '<audio id="yunaBgMusic" loop preload="auto" autoplay playsinline src="assets/One%20More%20Scroll.mp3"></audio>'
          s = re.sub(r'<audio id="yunaBgMusic"[^>]*></audio>', audio, s, count=1)

          start = s.find('const bgMusic=document.getElementById("yunaBgMusic");')
          if start == -1:
              raise SystemExit('music script marker not found')
          end = s.find('</script>', start)
          if end == -1:
              raise SystemExit('music script end not found')

          script = '''const bgMusic=document.getElementById("yunaBgMusic");
          const audioMute=document.getElementById("audioMute");
          if(bgMusic&&audioMute){
            const userMuted=()=>localStorage.getItem("yunamyst-music-muted")==="1";
            bgMusic.autoplay=true;
            bgMusic.playsInline=true;
            bgMusic.volume=0.08;

            const syncAudio=()=>{
              const muted=userMuted();
              audioMute.textContent=muted?"🔇":"🔊";
              audioMute.title=muted?"Ativar música":"Mutar música";
              audioMute.setAttribute("aria-label",audioMute.title);
            };

            const playAudio=()=>{
              if(userMuted()) return Promise.resolve(false);
              bgMusic.muted=false;
              bgMusic.volume=0.08;
              const promise=bgMusic.play();
              if(promise&&typeof promise.then==='function'){
                return promise.then(()=>true).catch(()=>false);
              }
              return Promise.resolve(true);
            };

            const showPlayState=()=>{
              if(userMuted()) return;
              audioMute.textContent="▶️";
              audioMute.title="Tocar música";
              audioMute.setAttribute("aria-label","Tocar música");
            };

            const attemptAutoplay=()=>{
              if(userMuted()) return;
              bgMusic.autoplay=true;
              bgMusic.muted=false;
              bgMusic.volume=0.08;
              playAudio().then(ok=>{
                if(ok) syncAudio();
                else showPlayState();
              });
            };

            audioMute.addEventListener("click",e=>{
              e.stopPropagation();
              if(bgMusic.paused){
                localStorage.setItem("yunamyst-music-muted","0");
                playAudio().then(ok=>{ if(ok) syncAudio(); });
                return;
              }
              const nextMuted=!userMuted();
              localStorage.setItem("yunamyst-music-muted",nextMuted?"1":"0");
              bgMusic.muted=nextMuted;
              syncAudio();
              if(!nextMuted) playAudio();
            });

            syncAudio();

            if(document.readyState==="loading"){
              document.addEventListener("DOMContentLoaded",attemptAutoplay,{once:true});
            }else{
              attemptAutoplay();
            }
            window.addEventListener("load",attemptAutoplay,{once:true});
            window.addEventListener("pageshow",attemptAutoplay,{once:true});

            /* Fallback only when the browser blocks autoplay. One normal page
               interaction starts the music; no mute -> unmute is required. */
            const unlockOnce=()=>{
              if(userMuted()||!bgMusic.paused) return;
              playAudio().then(ok=>{ if(ok) syncAudio(); });
            };
            ["pointerdown","touchstart","keydown"].forEach(evt=>{
              document.addEventListener(evt,unlockOnce,{capture:true,passive:true});
            });
          }'''
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          s = s[:start] + script + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No music changes needed."
          else
            git commit -m "Restore desktop music autoplay"
            git push
          fi