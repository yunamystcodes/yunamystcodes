name: Add background music control

on:
  push:
    paths:
      - '.github/workflows/add-background-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add music control to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          if 'id="yunaBgMusic"' not in s:
              audio = '<audio id="yunaBgMusic" loop preload="auto" src="assets/One%20More%20Scroll.mp3"></audio>'
              s = s.replace('<div class="bg"></div>', '<div class="bg"></div>\n' + audio, 1)

          if 'id="audioMute"' not in s:
              old = '<div class="lang-wrap"><button class="lang" id="langBtn" type="button">'
              new = (
                  '<div class="lang-wrap">'
                  '<button class="audio-mute" id="audioMute" type="button" '
                  'aria-label="Mutar música" title="Mutar música">🔊</button>'
                  '<button class="lang" id="langBtn" type="button">'
              )
              if old in s:
                  s = s.replace(old, new, 1)

          if '.audio-mute{' not in s:
              css = (
                  '\n.audio-mute{width:42px;height:42px;border:1px solid #a85cff;'
                  'border-radius:10px;background:#0c0a18;color:#fff;cursor:pointer;'
                  'display:grid;place-items:center;font-size:20px;line-height:1;padding:0;'
                  'box-shadow:0 0 12px rgba(168,92,255,.12)}'
                  '\n.audio-mute:hover{background:#24113d;border-color:#c17cff}'
                  '\n@media(max-width:600px){.audio-mute{width:38px;height:38px;'
                  'border-radius:9px;font-size:18px}}\n'
              )
              s = s.replace('</style>', css + '</style>', 1)

          # Replace the old music controller with a mobile-safe version.
          start = s.find('const bgMusic=document.getElementById("yunaBgMusic");')
          end = s.find('\n}', start) if start != -1 else -1
          if start != -1:
              # Find the closing brace of the controller block by using the next script tag.
              script_end = s.find('</script>', start)
              block = s[start:script_end]
              if 'const syncAudio=' in block and 'document.addEventListener("pointerdown",tryPlay' in block:
                  new_block = '''const bgMusic=document.getElementById("yunaBgMusic");
const audioMute=document.getElementById("audioMute");
if(bgMusic&&audioMute){
  const userMuted=()=>localStorage.getItem("yunamyst-music-muted")==="1";
  bgMusic.volume=0.08;
  bgMusic.muted=true;
  const syncAudio=()=>{
    const muted=userMuted();
    audioMute.textContent=muted?"🔇":"🔊";
    audioMute.title=muted?"Ativar música":"Mutar música";
    audioMute.setAttribute("aria-label",audioMute.title);
  };
  const playAudio=()=>{
    if(userMuted()) return;
    bgMusic.muted=false;
    bgMusic.volume=0.08;
    const p=bgMusic.play();
    if(p&&typeof p.catch==='function') p.catch(()=>{});
  };
  const unlockAudio=()=>playAudio();
  audioMute.addEventListener("click",e=>{
    e.stopPropagation();
    const nextMuted=!userMuted();
    localStorage.setItem("yunamyst-music-muted",nextMuted?"1":"0");
    bgMusic.muted=nextMuted;
    syncAudio();
    if(!nextMuted) playAudio();
  });
  ["touchstart","touchend","pointerdown","pointerup","click","keydown"].forEach(evt=>{
    document.addEventListener(evt,unlockAudio,{capture:true,passive:true});
  });
  syncAudio();
}'''
                  s = s[:start] + new_block + s[script_end:]

          p.write_text(s, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No music changes needed."
          else
            git commit -m "Fix mobile background music playback"
            git push
          fi