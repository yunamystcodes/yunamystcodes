name: Add background music control

on:
  push:
    paths:
      - '.github/workflows/add-background-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add music control to index
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          if 'id="yunaBgMusic"' not in s:
              audio = '<audio id="yunaBgMusic" loop preload="auto" src="assets/One%20More%20Scroll.mp3"></audio>'
              s = s.replace('<div class="bg"></div>', '<div class="bg"></div>\n' + audio, 1)

              s = s.replace(
                  '.lang-wrap{position:relative}',
                  '.lang-wrap{position:relative;display:flex;align-items:center;gap:8px}',
                  1
              )

              css = (
                  '\n.audio-mute{width:42px;height:42px;border:1px solid #a85cff;'
                  'border-radius:10px;background:#0c0a18;color:#fff;cursor:pointer;'
                  'display:grid;place-items:center;font-size:20px;line-height:1;padding:0;'
                  'box-shadow:0 0 12px rgba(168,92,255,.12)}'
                  '\n.audio-mute:hover{background:#24113d;border-color:#c17cff}'
                  '\n@media(max-width:600px){.audio-mute{width:38px;height:38px;'
                  'border-radius:9px;font-size:18px}}'
                  '\n'
              )
              s = s.replace('</style>', css + '</style>', 1)

              old = '<div class="lang-wrap"><button class="lang" id="langBtn" type="button">'
              new = (
                  '<div class="lang-wrap">'
                  '<button class="audio-mute" id="audioMute" type="button" '
                  'aria-label="Mutar música" title="Mutar música">🔇</button>'
                  '<button class="lang" id="langBtn" type="button">'
              )
              if old not in s:
                  raise SystemExit("language control not found")
              s = s.replace(old, new, 1)

              js = (
                  '\nconst bgMusic=document.getElementById("yunaBgMusic");'
                  '\nconst audioMute=document.getElementById("audioMute");'
                  '\nif(bgMusic&&audioMute){'
                  '\n  bgMusic.volume=0.08;'
                  '\n  bgMusic.muted=localStorage.getItem("yunamyst-music-muted")==="1";'
                  '\n  const syncAudio=()=>{'
                  '\n    audioMute.textContent=bgMusic.muted?"🔇":"🔊";'
                  '\n    audioMute.title=bgMusic.muted?"Ativar música":"Mutar música";'
                  '\n    audioMute.setAttribute("aria-label",audioMute.title);'
                  '\n  };'
                  '\n  const tryPlay=()=>{if(!bgMusic.muted)bgMusic.play().catch(()=>{});};'
                  '\n  audioMute.addEventListener("click",e=>{'
                  '\n    e.stopPropagation();'
                  '\n    bgMusic.muted=!bgMusic.muted;'
                  '\n    localStorage.setItem("yunamyst-music-muted",bgMusic.muted?"1":"0");'
                  '\n    syncAudio();'
                  '\n    if(!bgMusic.muted)tryPlay();'
                  '\n  });'
                  '\n  document.addEventListener("pointerdown",tryPlay,{once:true});'
                  '\n  syncAudio();'
                  '\n}'
                  '\n'
              )
              s = s.replace('</script>', js + '</script>', 1)
              p.write_text(s, encoding="utf-8")

          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No music changes needed."
          else
            git commit -m "Add background music control"
            git push
          fi
