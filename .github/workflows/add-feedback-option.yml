name: Add feedback option

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/add-feedback-option.yml'

permissions:
  contents: write

jobs:
  feedback:
    if: ${{ !contains(github.event.head_commit.message, '[feedback-update]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install on-site 5-star feedback
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          endpoint='https://formspree.io/f/mdenpbql'
          s=s.replace('href="https://chat.whatsapp.com/KWg53GNpXDA3G5lDT8VwOg?s=cl&amp;p=a&amp;ilr=0" rel="noopener" target="_blank">💬 DEIXE SEU FEEDBACK','href="#feedbackModal" class="yuna-feedback-open">💬 DEIXE SEU FEEDBACK')
          s=s.replace('href="#feedbackModal">💬 DEIXE SEU FEEDBACK','href="#feedbackModal" class="yuna-feedback-open">💬 DEIXE SEU FEEDBACK')
          if 'id="feedbackModal"' not in s:
            css='''<style id="ym-feedback-css">.ymfm{display:none;position:fixed;inset:0;z-index:9999;background:rgba(2,1,9,.82);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:16px}.ymfm.open{display:flex}.ymfb{width:min(520px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#17102b,#080615);border:1px solid #a85cff;border-radius:20px;padding:24px;position:relative;box-shadow:0 25px 80px #000;color:#fff}.ymfb h2{color:#f3d27a;font:900 26px Georgia,serif;margin:0 35px 8px 0;text-align:center}.ymfb p{color:#cfc6dc;font-size:13px;line-height:1.5;text-align:center}.ymfc{position:absolute;right:12px;top:12px;width:34px;height:34px;border:1px solid #5c397b;border-radius:9px;background:#17102a;color:#fff;font-size:22px;cursor:pointer}.ymstars{display:flex;justify-content:center;gap:5px;margin:15px 0 4px}.ymstar{border:0;background:none;color:#51465f;font-size:40px;line-height:1;cursor:pointer;padding:2px;transition:.15s}.ymstar.sel,.ymstar:hover{color:#f3bd52;text-shadow:0 0 14px rgba(243,189,82,.35)}.ymrating{text-align:center;color:#9f96ad;font-size:11px;min-height:17px}.ymfb input,.ymfb textarea{width:100%;border:1px solid rgba(168,92,255,.45);border-radius:10px;background:#0d0919;color:#fff;padding:11px;margin-top:7px;box-sizing:border-box;font:inherit;outline:none}.ymfb textarea{min-height:120px;resize:vertical}.ymlabel{display:block;color:#f0eafa;font-size:12px;font-weight:900;margin-top:14px}.ymsend{width:100%;margin-top:16px;border:1px solid #e7b953;border-radius:11px;background:linear-gradient(180deg,#f3c866,#b77b22);color:#241300;padding:12px;font-weight:900;cursor:pointer}.ymsend:disabled{opacity:.6;cursor:wait}.ymstatus{text-align:center;min-height:18px;margin-top:10px;color:#7df0a5;font-size:12px;font-weight:800}@media(max-width:600px){.ymfb{padding:20px 16px}.ymfb h2{font-size:22px}.ymstar{font-size:34px}}</style>'''
            html=f'''<div class="ymfm" id="feedbackModal" aria-hidden="true"><div class="ymfb" role="dialog" aria-modal="true" aria-labelledby="ymFeedbackTitle"><button class="ymfc" id="ymfc" type="button" aria-label="Fechar">×</button><h2 id="ymFeedbackTitle">💜 DEIXE SEU FEEDBACK</h2><p>Escolhe de 1 a 5 estrelas e conta-nos o que achaste do site.</p><form id="ymFeedbackForm" action="{endpoint}" method="POST"><input type="hidden" name="_subject" value="Novo feedback — YunaMyst Codes"><span class="ymlabel">A tua avaliação</span><div class="ymstars" id="ymstars" role="radiogroup" aria-label="Avaliação de 1 a 5 estrelas"><button class="ymstar" type="button" data-star="1">★</button><button class="ymstar" type="button" data-star="2">★</button><button class="ymstar" type="button" data-star="3">★</button><button class="ymstar" type="button" data-star="4">★</button><button class="ymstar" type="button" data-star="5">★</button></div><div class="ymrating" id="ymrating">Escolhe de 1 a 5 estrelas</div><label class="ymlabel">Nome ou apelido (opcional)<input id="ymname" name="name" maxlength="80" placeholder="Como queres ser identificado?"></label><label class="ymlabel">O teu feedback<textarea id="ymtext" name="message" maxlength="1500" required placeholder="Conta-nos o que achaste do site..."></textarea></label><button class="ymsend" id="ymsend" type="submit">⭐ ENVIAR FEEDBACK</button><div class="ymstatus" id="ymstatus" aria-live="polite"></div></form></div></div>'''
            js='''<script id="ym-feedback-js">(()=>{const m=document.getElementById("feedbackModal"),c=document.getElementById("ymfc"),f=document.getElementById("ymFeedbackForm"),b=document.getElementById("ymsend"),st=document.getElementById("ymstatus"),rt=document.getElementById("ymrating"),stars=[...document.querySelectorAll(".ymstar")];if(!m||!f)return;let rating=0;const paint=()=>stars.forEach(x=>x.classList.toggle("sel",+x.dataset.star<=rating));const open=()=>{m.classList.add("open");m.setAttribute("aria-hidden","false");document.body.style.overflow="hidden"};const close=()=>{m.classList.remove("open");m.setAttribute("aria-hidden","true");document.body.style.overflow=""};document.querySelectorAll(".yuna-feedback-open").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();open()}));stars.forEach(x=>x.addEventListener("click",()=>{rating=+x.dataset.star;rt.textContent=rating+" de 5 estrelas";paint()}));c&&c.addEventListener("click",close);m.addEventListener("click",e=>{if(e.target===m)close()});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&m.classList.contains("open"))close()});f.addEventListener("submit",e=>{e.preventDefault();if(!rating){rt.textContent="Escolhe uma avaliação de 1 a 5 estrelas";return}b.disabled=true;st.textContent="A enviar...";const data=new FormData(f);data.set("rating",String(rating));fetch(f.action,{method:"POST",body:data,headers:{Accept:"application/json"}}).then(r=>{if(!r.ok)throw new Error("send");return r.json().catch(()=>({}))}).then(()=>{st.textContent="✓ Obrigado! O teu feedback foi enviado.";f.reset();rating=0;paint();rt.textContent="Escolhe de 1 a 5 estrelas";setTimeout(close,1800)}).catch(()=>{st.textContent="Não foi possível enviar agora. Tenta novamente."}).finally(()=>{b.disabled=false})})})();</script>'''
            s=s.replace('</head>',css+'</head>',1)
            s=s.replace('</body>',html+js+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit feedback update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-feedback-widget.yml 2>/dev/null || true
          git add index.html .github/workflows/apply-feedback-widget.yml
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Install on-site 5-star feedback [feedback-update]"; git push; fi
