name: Corrigir botão de parceria PC e telemóvel

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar somente as correções da parceria
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('Queres fazer uma parceria com o YunaMyst Codes?','Queres fazer uma parceria com a YunaMyst Codes?')
          pat=r'<a href="#" class="partnership partnership-desktop" id="yunaDesktopPartnershipButton"[\s\S]*?</a>\s*'
          m=re.search(pat,s,re.I)
          if m:
              desktop=m.group(0); s=s[:m.start()]+s[m.end():]
          else:
              desktop='''<a href="#" class="partnership partnership-desktop" id="yunaDesktopPartnershipButton" aria-label="Abrir informações de parceria"><span class="picon">🤝</span><span><b>FAZER PARCERIA</b><small>Colabora com a YunaMyst Codes</small></span><strong>›</strong></a>\n'''
          target='<section class="panel faq" id="faq">'
          if target not in s: raise SystemExit('FAQ_NAO_ENCONTRADA')
          s=s.replace(target,desktop+target,1)
          css='''<style id="yuna-partnership-responsive-final">@media (min-width:851px){#yunaPartnershipButton{display:none!important}#yunaDesktopPartnershipButton{display:flex!important;margin:0 0 12px!important;width:100%!important;max-width:none!important}}@media (max-width:850px){#yunaPartnershipButton{display:flex!important}#yunaDesktopPartnershipButton{display:none!important}}</style>'''
          s=re.sub(r'<style id="yuna-partnership-responsive-final">[\s\S]*?</style>','',s,flags=re.I)
          s=s.replace('</head>',css+'</head>',1)
          s=s.replace("const b=document.getElementById('yunaPartnershipButton');","const buttons=[document.getElementById('yunaPartnershipButton'),document.getElementById('yunaDesktopPartnershipButton')].filter(Boolean);")
          s=s.replace("if(!b||!m||!c)return;","if(!buttons.length||!m||!c)return;")
          s=s.replace("b.addEventListener('click',function(e){e.preventDefault();m.classList.add('open');m.setAttribute('aria-hidden','false');});","buttons.forEach(b=>b.addEventListener('click',function(e){e.preventDefault();m.classList.add('open');m.setAttribute('aria-hidden','false');}));")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar com retry para evitar conflito entre workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fixar parceria ao lado da FAQ no PC' || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            git fetch origin main
            git reset --soft origin/main
            git commit -m 'Fixar parceria ao lado da FAQ no PC' || true
          done
          exit 1
