name: Corrigir botão de parceria PC e telemóvel

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir parceria e adicionar códigos novos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Queres fazer uma parceria com o YunaMyst Codes?','Queres fazer uma parceria com a YunaMyst Codes?')

          # PC: parceria ao lado da FAQ. Telemóvel: parceria abaixo do WhatsApp.
          pat=r'<a href="#" class="partnership partnership-desktop" id="yunaDesktopPartnershipButton"[\s\S]*?</a>\s*'
          s=re.sub(pat,'',s,count=1,flags=re.I)
          desktop='<a href="#" class="partnership partnership-desktop" id="yunaDesktopPartnershipButton" aria-label="Abrir informações de parceria"><span class="picon">🤝</span><span><b>FAZER PARCERIA</b><small>Colabora com a YunaMyst Codes</small></span><strong>›</strong></a>\n'
          target='<section class="panel faq" id="faq">'
          if target not in s: raise SystemExit('FAQ_NAO_ENCONTRADA')
          s=s.replace(target,desktop+target,1)
          if 'id="yunaPartnershipButton"' not in s:
              mobile='<a href="#" class="partnership" id="yunaPartnershipButton" aria-label="Abrir informações de parceria"><span class="picon">🤝</span><span><b>FAZER PARCERIA</b><small>Colabora com a YunaMyst Codes</small></span><strong>›</strong></a>\n'
              wa_end='</a>\n</section>'
              pos=s.find(wa_end,s.find('<a class="whats"'))
              if pos<0: raise SystemExit('WHATSAPP_NAO_ENCONTRADO')
              pos+=len('</a>\n')
              s=s[:pos]+mobile+s[pos:]
          css='<style id="yuna-partnership-responsive-final">@media (min-width:851px){#yunaPartnershipButton{display:none!important}#yunaDesktopPartnershipButton{display:flex!important;margin:0 0 12px!important;width:100%!important;max-width:none!important}}@media (max-width:850px){#yunaPartnershipButton{display:flex!important;margin:0 auto 22px!important;width:100%!important;max-width:760px!important}#yunaDesktopPartnershipButton{display:none!important}}</style>'
          s=re.sub(r'<style id="yuna-partnership-responsive-final">[\s\S]*?</style>','',s,flags=re.I)
          s=s.replace('</head>',css+'</head>',1)

          # Códigos novos de 15/08/2026.
          marker='<div class="codes" id="activeCodesList">'
          pos=s.find(marker)
          if pos<0: raise SystemExit('LISTA_DE_CODIGOS_NAO_ENCONTRADA')
          pos=s.find('>',pos)+1
          cards=[]
          if 'data-code="YYDSSWC26ZAN"' not in s:
              cards.append('<article class="code" data-code="YYDSSWC26ZAN" data-expires="2026-08-22T00:00:00"><div class="gift">🎁</div><div class="cinfo"><strong>YYDSSWC26ZAN</strong><small>🆕 Código novo de 15/08/2026</small></div><div class="reward-icons" aria-label="Recompensas"><span class="reward-chip"><span class="reward-unknown">🎁</span><b>Recompensa</b></span></div><button class="copy" onclick="copiarCodigo(\'YYDSSWC26ZAN\',this)"><span data-i18n="copy">▣ COPIAR</span></button><a class="iphone" href="https://withhive.me/313/YYDSSWC26ZAN" target="_blank" rel="noopener"><span class="iphone-full"> LINK IPHONE</span><span class="iphone-short"> LINK</span></a></article>')
          if 'data-code="4MINGYIDAOXIAN"' not in s:
              cards.append('<article class="code" data-code="4MINGYIDAOXIAN" data-expires="2026-08-22T00:00:00"><div class="gift">🎁</div><div class="cinfo"><strong>4MINGYIDAOXIAN</strong><small>🆕 Código novo de 15/08/2026</small></div><div class="reward-icons" aria-label="Recompensas"><span class="reward-chip"><span class="reward-unknown">🎁</span><b>Recompensa</b></span></div><button class="copy" onclick="copiarCodigo(\'4MINGYIDAOXIAN\',this)"><span data-i18n="copy">▣ COPIAR</span></button><a class="iphone" href="https://withhive.me/313/4MINGYIDAOXIAN" target="_blank" rel="noopener"><span class="iphone-full"> LINK IPHONE</span><span class="iphone-short"> LINK</span></a></article>')
          if cards: s=s[:pos]+''.join(cards)+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar com retry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Atualizar parceria e códigos novos' || exit 0
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; git reset --hard origin/main; continue; }
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard origin/main
            sleep 2
          done
          exit 1
