name: Ajustar energia e botoes dos codigos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ajustar layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''<style id="final-reward-layout">
          @media (min-width:851px){
            .code{flex-wrap:nowrap!important;gap:7px!important}
            .code .cinfo{flex:1 1 auto!important;min-width:120px!important}
            .code .reward-icons{flex:0 0 auto!important;gap:5px!important;margin:0 2px 0 0!important;justify-content:flex-start!important}
            .code .reward-chip{gap:4px!important}
            .code .reward-img{width:30px!important;height:30px!important}
            .code .reward-energy{width:30px!important;font-size:23px!important}
            .code .reward-chip b{font-size:12px!important}
            .code .copy,.code .iphone{flex:0 0 auto!important;width:auto!important;min-width:82px!important;margin:0!important}
            .code .copy + .iphone{margin-left:0!important}
          }

          @media (max-width:600px){
            /* Os icones/recompensas ficam intocados. Alteramos apenas os dois botoes. */
            .codes .code .copy,
            .codes .code .iphone{
              position:static!important;
              display:flex!important;
              align-items:center!important;
              justify-content:center!important;
              box-sizing:border-box!important;
              width:120px!important;
              min-width:120px!important;
              max-width:120px!important;
              height:44px!important;
              min-height:44px!important;
              max-height:44px!important;
              margin:0!important;
              padding:0 8px!important;
              flex:none!important;
              font-size:12px!important;
              line-height:1!important;
              border-radius:10px!important;
              overflow:hidden!important;
              white-space:nowrap!important;
              justify-self:center!important;
            }
            .codes .code .copy{grid-column:1!important;grid-row:3!important}
            .codes .code .iphone{grid-column:2!important;grid-row:3!important}
            .codes .code{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;column-gap:8px!important}
          }

          @media (max-width:380px){
            .codes .code .copy,
            .codes .code .iphone{
              width:112px!important;
              min-width:112px!important;
              max-width:112px!important;
              height:42px!important;
              min-height:42px!important;
              max-height:42px!important;
              font-size:11px!important;
            }
            .codes .code{column-gap:6px!important}
          }
          </style>'''

          s = re.sub(r'<style id="final-reward-layout">.*?</style>\s*', '', s, flags=re.S)
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Ajustar tamanho dos botoes no telemovel"
          git push
