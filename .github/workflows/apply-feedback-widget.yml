name: Apply feedback widget
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install widget
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'(<div class="feedback-option" id="feedback">\s*<a )href="[^"]+"',r'\1href="#feedbackModal"',s,count=1)
          s=re.sub(r'(<div class="feedback-option" id="mobile-feedback">\s*<a )href="[^"]+"',r'\1href="#feedbackModal"',s,count=1)
          css='''<style id="ym-feedback-css">.ymfm{display:none;position:fixed;inset:0;z-index:9999;background:rgba(2,1,9,.82);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:16px}.ymfm.open{display:flex}.ymfb{width:min(520px,100%);background:linear-gradient(180deg,#17102b,#080615);border:1px solid #a85cff;border-radius:20px;padding:24px;position:relative;box-shadow:0 25px 80px #000}.ymfb h2{color:#f3d27a;font:900 26px Georgia,serif;margin:0 35px 8px 0}.ymfb p{color:#cfc6dc;font-size:13px;line-height:1.5}.ymfc{position:absolute;right:12px;top:12px;width:34px;height:34px;border:1px solid #5c397b;border-radius:9px;background:#17102a;color:#fff;font-size:22px}.ymstars{display:flex;justify-content:center;gap:6px;margin:16px 0}.ymstar{border:0;background:none;color:#51465f;font-size:38px;cursor:pointer}.ymstar.sel{color:#f3bd52;text-shadow:0 0 14px rgba(243,189,82,.35)}.ymfb input,.ymfb textarea{width:100%;border:1px solid rgba(168,92,255,.45);border-radius:10px;background:#0d0919;color:#fff;padding:11px;margin-top:7px;box-sizing:border-box;font:inherit}.ymfb textarea{min-height:120px;resize:vertical}.ymsend{width:100%;margin-top:14px;border:1px solid #a85cff;border-radius:11px;background:linear-gradient(180deg,#7a34c0,#3a146b);color:#fff;padding:12px;font-weight:900;cursor:pointer}.ymlabel{display:block;color:#f0eafa;font-size:12px;font-weight:900;margin-top:10px}.ymok{display:none;text-align:center;padding:25px}.ymok.show{display:block}.ymform.hide{display:none}@media(max-width:600px){.ymfb{padding:20px 16px}.ymfb h2{font-size:22px}.ymstar{font-size:34px}}</style>'''
          html='''<div class="ymfm" id="feedbackModal" aria-hidden="true"><div class="ymfb" role="dialog" aria-modal="true"><button class="ymfc" id="ymfc" type="button">×</button><div class="ymform" id="ymform"><h2>💜 Deixe o seu feedback</h2><p>Escolhe de 1 a 5 estrelas e conta-nos o que achaste do site.</p><span class="ymlabel">A tua avaliação</span><div class="ymstars">''' + ''.join(f'<button class="ymstar" type="button" data-star="{i}">★</button>' for i in range(1,6)) + '''</div><label class="ymlabel">Nome (opcional)<input id="ymname" maxlength="60" placeholder="Como queres aparecer?"/></label><label class="ymlabel">Feedback<textarea id="ymtext" maxlength="1000" placeholder="Escreve a tua opinião ou sugestão..."></textarea></label><button class="ymsend" id="ymsend" type="button">⭐ ENVIAR FEEDBACK</button></div><div class="ymok" id="ymok"><div style="font-size:42px">💜</div><h3 style="color:#f3d27a">Obrigado!</h3><p>O teu feedback foi registado.</p></div></div></div>'''
          js='''<script id="ym-feedback-js">(()=>{const m=document.getElementById("feedbackModal"),c=document.getElementById("ymfc"),f=document.getElementById("ymform"),o=document.getElementById("ymok"),ss=[...document.querySelectorAll(".ymstar")],n=document.getElementById("ymname"),t=document.getElementById("ymtext"),b=document.getElementById("ymsend");let r=0;const paint=()=>ss.forEach(x=>x.classList.toggle("sel",+x.dataset.star<=r));const open=()=>{m.classList.add("open");m.setAttribute("aria-hidden","false");document.body.style.overflow="hidden"};const close=()=>{m.classList.remove("open");m.setAttribute("aria-hidden","true");document.body.style.overflow=""};document.querySelectorAll('a[href="#feedbackModal"]').forEach(a=>a.onclick=e=>{e.preventDefault();open()});ss.forEach(x=>x.onclick=()=>{r=+x.dataset.star;paint()});c.onclick=close;m.onclick=e=>{if(e.target===m)close()};document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});b.onclick=()=>{if(!r)return alert("Escolhe de 1 a 5 estrelas.");if(!t.value.trim())return alert("Escreve o teu feedback.");let a=JSON.parse(localStorage.getItem("yunamyst-feedback")||"[]");a.push({rating:r,name:n.value.trim()||"Player",message:t.value.trim(),date:new Date().toISOString()});localStorage.setItem("yunamyst-feedback",JSON.stringify(a.slice(-100)));f.classList.add("hide");o.classList.add("show");setTimeout(()=>{close();f.classList.remove("hide");o.classList.remove("show");r=0;paint();n.value="";t.value=""},1800)}})();</script>'''
          if 'id="feedbackModal"' not in s:s=s.replace('</body>',css+html+js+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/apply-feedback-widget.yml
          git commit -m "Add on-site 5-star feedback form"
          git push
