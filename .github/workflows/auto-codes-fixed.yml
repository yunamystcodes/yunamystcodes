name: Atualizar códigos automaticamente - YunaCodes

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-codes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Agregar códigos de 6 fontes
        run: python scripts/auto_update_codes_fixed.py

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/code_history.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos códigos."
          else
            git commit -m "Atualizar códigos de múltiplas fontes"
            git pull --rebase origin main
            git push
          fi
