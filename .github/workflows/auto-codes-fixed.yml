name: Atualizar códigos automaticamente - YunaCodes

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: yuna-codes-updater
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-codes:
    # Executa imediatamente após alterações manuais, mas não entra em loop
    # quando o próprio bot publica a atualização dos códigos.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Atualizar código sem limite de quantidade
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/auto_update_codes_fixed.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('[:8]', '[:]', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Agregar códigos de todas as fontes
        run: python scripts/auto_update_codes_fixed.py

      - name: Mostrar todos os códigos ativos no index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('var visibleCount=8;', 'var visibleCount=cards.length;')
          s = s.replace('var visibleCount = 8;', 'var visibleCount = cards.length;')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/code_history.json scripts/auto_update_codes_fixed.py
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos códigos."
          else
            git pull --rebase origin main
            git add index.html data/code_history.json scripts/auto_update_codes_fixed.py
            git commit -m "Atualizar todos os códigos ativos no site"
            git push origin HEAD:main
          fi
