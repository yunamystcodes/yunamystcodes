name: Atualizar códigos automaticamente - YunaCodes

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/auto-codes-fixed.yml'

concurrency:
  group: yuna-codes-updater
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-codes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Instalar dependências
        run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Atualizar códigos automaticamente
        run: python scripts/auto_update_codes_fixed.py
      - name: Remover códigos confirmados expirados
        run: python scripts/enforce_expired.py
      - name: Validar lista de códigos sem reescrever o site
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          p = Path('index.html')
          soup = BeautifulSoup(p.read_text(encoding='utf-8'), 'html.parser')
          block = soup.find(id='activeCodesList')
          if block is None:
              raise SystemExit('activeCodesList não encontrado')
          count = len(block.select('[data-code]'))
          print(f'Códigos ativos no index: {count}')
          if count == 0:
              raise SystemExit('Nenhum código ativo foi gerado')
          PY
      - name: Publicar alterações com retry seguro
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add index.html data/code_history.json
            if git diff --cached --quiet; then
              echo "Nenhuma alteração necessária."
              exit 0
            fi
            git commit -m "Atualizar automaticamente todos os códigos ativos"
            if git push origin HEAD:main; then
              echo "Publicação concluída."
              exit 0
            fi
            echo "Push falhou; sincronizando main e refazendo a coleta (tentativa $attempt/3)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/auto_update_codes_fixed.py
            python scripts/enforce_expired.py
          done
          echo "Não foi possível publicar depois de 3 tentativas."
          exit 1
