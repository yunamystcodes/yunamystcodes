name: Atualizar códigos automaticamente - YunaCodes

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: yuna-codes-updater
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-codes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Agregar códigos de todas as fontes
        run: python scripts/auto_update_codes_fixed.py

      - name: Mostrar todos os códigos ativos no index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('var visibleCount=8;', 'var visibleCount=cards.length;')
          s = s.replace('var visibleCount = 8;', 'var visibleCount = cards.length;')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verificar códigos encontrados
        run: |
          echo '--- CÓDIGOS ATIVOS ENCONTRADOS ---'
          grep -oE '[A-Z0-9]{8,24}' index.html | sort -u | head -100

      - name: Publicar alterações no main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/code_history.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos códigos."
            exit 0
          fi
          git commit -m "Atualizar todos os códigos ativos no site"
          git push origin HEAD:main
