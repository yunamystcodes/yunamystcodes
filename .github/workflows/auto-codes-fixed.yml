name: Atualizar códigos automaticamente - YunaCodes

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: yuna-codes-updater
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-codes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Instalar dependências
        run: pip install requests beautifulsoup4
      - name: Atualizar códigos de todas as fontes
        run: python scripts/auto_update_codes_fixed.py
      - name: Remover códigos confirmados expirados
        run: python scripts/enforce_expired.py
      - name: Garantir todos os códigos visíveis
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('var visibleCount=8;', 'var visibleCount=cards.length;')
          s = s.replace('var visibleCount = 8;', 'var visibleCount=cards.length;')
          s = s.replace('var visibleCount=4;', 'var visibleCount=cards.length;')
          s = s.replace('var visibleCount = 4;', 'var visibleCount=cards.length;')
          soup = BeautifulSoup(s, 'html.parser')
          block = soup.find(id='activeCodesList')
          if block is None:
              raise SystemExit('activeCodesList não encontrado')
          print('Códigos ativos no index:', len(block.select('[data-code]')))
          if not block.select('[data-code]'):
              raise SystemExit('Nenhum código ativo foi gerado')
          p.write_text(str(soup), encoding='utf-8')
          PY
      - name: Publicar alterações com retry seguro
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add index.html data/code_history.json
            if git diff --cached --quiet; then
              echo "Nenhuma alteração necessária."
              exit 0
            fi
            git commit -m "Atualizar automaticamente todos os códigos ativos"
            if git push origin HEAD:main; then
              echo "Publicação concluída."
              exit 0
            fi
            echo "Push falhou; sincronizando main e refazendo a coleta (tentativa $attempt/3)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/auto_update_codes_fixed.py
            python scripts/enforce_expired.py
            python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('var visibleCount=8;', 'var visibleCount=cards.length;')
          s = s.replace('var visibleCount = 8;', 'var visibleCount=cards.length;')
          s = s.replace('var visibleCount=4;', 'var visibleCount=cards.length;')
          s = s.replace('var visibleCount = 4;', 'var visibleCount=cards.length;')
          p.write_text(s, encoding='utf-8')
          PY
          done
          echo "Não foi possível publicar depois de 3 tentativas."
          exit 1
