name: Corrigir texto da parceria

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/corrigir-yunamyst-parceria.yml'

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir apenas textos da parceria
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Queres fazer uma parceria com o YunaMyst Codes?':'Queres fazer uma parceria com a YunaMyst?',
              'Colabora com a YunaMyst Codes':'Colabora com a YunaMyst',
              'Colabora com o YunaMyst Codes':'Colabora com a YunaMyst',
              'redes sociais do YunaMyst':'redes sociais da YunaMyst',
              'redes sociais do YunaMyst.':'redes sociais da YunaMyst.',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar somente se houve alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'Corrigir textos da parceria'
          git push origin HEAD:main
