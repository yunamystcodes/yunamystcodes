name: Corrigir texto da parceria

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir textos da parceria e redes sociais
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          substituicoes = {
              'Queres fazer uma parceria com o YunaMyst Codes?': 'Queres fazer uma parceria com a YunaMyst?',
              'Colabora com o YunaMyst Codes': 'Colabora com a YunaMyst',
              'Colabora com a YunaMyst Codes': 'Colabora com a YunaMyst',
              'redes sociais do YunaMyst': 'redes sociais da YunaMyst',
              'redes sociais do YunaMyst.': 'redes sociais da YunaMyst.',
          }

          for old, new in substituicoes.items():
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir texto das redes sociais"
          git push
