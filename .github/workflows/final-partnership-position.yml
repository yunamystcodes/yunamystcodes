name: Posicionar parceria no PC e telemóvel

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar parceria e cabeçalho
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('Queres fazer uma parceria com o YunaMyst Codes?', 'Queres fazer uma parceria com a YunaMyst?')
          s=s.replace('Colabora com a YunaMyst Codes', 'Colabora com a YunaMyst')

          m=re.search(r'<a href="#" class="partnership partnership-desktop" id="yunaDesktopPartnershipButton"[\s\S]*?</a>\s*', s, flags=re.I)
          if m:
              desktop=m.group(0)
              s=s[:m.start()]+s[m.end():]
          else:
              desktop='''<a href="#" class="partnership partnership-desktop" id="yunaDesktopPartnershipButton" aria-label="Abrir informações de parceria"><span class="picon">🤝</span><span><b>FAZER PARCERIA</b><small>Colabora com a YunaMyst</small></span><strong>›</strong></a>\n'''

          faq='<section class="panel faq" id="faq">'
          if 'id="yunaDesktopPartnershipButton"' not in s:
              if faq not in s:
                  raise SystemExit('FAQ_NAO_ENCONTRADA')
              s=s.replace(faq, desktop+faq, 1)

          s=re.sub(r'<style id="yuna-partnership-final-position">[\s\S]*?</style>\s*','',s,flags=re.I)
          partnership_css='''
<style id="yuna-partnership-final-position">
/* YUNAMYST PARTNERSHIP FINAL POSITION */
@media (min-width:851px){
  #yunaPartnershipButton{display:none!important}
  #yunaDesktopPartnershipButton{display:flex!important;margin:0 0 12px!important;width:100%!important;max-width:none!important}
}
@media (max-width:850px){
  #yunaPartnershipButton{display:flex!important}
  #yunaDesktopPartnershipButton{display:none!important}
}
</style>
'''

          s=re.sub(r'<style id="yunamyst-header-logo-final">[\s\S]*?</style>\s*','',s,flags=re.I)
          header_css='''
<style id="yunamyst-header-logo-final">
/* YUNAMYST-WIDE-HEADER-FINAL-SIZE */
.nav{height:76px!important;align-items:center!important}
.logo{width:250px!important;max-width:250px!important;height:62px!important;max-height:62px!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;background-image:none!important;color:transparent!important;font-size:0!important;line-height:0!important;text-indent:0!important;overflow:hidden!important;flex:0 0 auto!important;margin:0!important;padding:0!important}
.logo-mark{display:block!important;width:250px!important;max-width:250px!important;height:62px!important;max-height:62px!important;object-fit:contain!important;object-position:center!important;margin:0!important}
.logo-text,.logo small{display:none!important}
@media(max-width:850px){.logo{width:220px!important;max-width:220px!important;height:58px!important;max-height:58px!important}.logo-mark{width:220px!important;max-width:220px!important;height:58px!important;max-height:58px!important}}
@media(max-width:600px){.nav{height:70px!important}.logo{width:195px!important;max-width:195px!important;height:52px!important;max-height:52px!important}.logo-mark{width:195px!important;max-width:195px!important;height:52px!important;max-height:52px!important}}
</style>
'''
          s=s.replace('</head>',header_css+partnership_css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fixar tamanho da logo do cabeçalho [skip ci]'
          git push origin HEAD:main
