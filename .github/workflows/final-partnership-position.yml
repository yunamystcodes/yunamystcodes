name: Posicionar parceria no PC e telemóvel

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar somente a parceria
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('Queres fazer uma parceria com o YunaMyst Codes?', 'Queres fazer uma parceria com a YunaMyst Codes?')

          # Retirar o botão desktop da posição atual e colocá-lo imediatamente antes da FAQ, na coluna direita.
          m=re.search(r'<a href="#" class="partnership partnership-desktop" id="yunaDesktopPartnershipButton"[\s\S]*?</a>\s*', s, flags=re.I)
          if m:
              desktop=m.group(0)
              s=s[:m.start()]+s[m.end():]
          else:
              desktop='''<a href="#" class="partnership partnership-desktop" id="yunaDesktopPartnershipButton" aria-label="Abrir informações de parceria"><span class="picon">🤝</span><span><b>FAZER PARCERIA</b><small>Colabora com a YunaMyst Codes</small></span><strong>›</strong></a>\n'''

          faq='<section class="panel faq" id="faq">'
          if 'id="yunaDesktopPartnershipButton"' not in s:
              if faq not in s:
                  raise SystemExit('FAQ_NAO_ENCONTRADA')
              s=s.replace(faq, desktop+faq, 1)

          marker='/* YUNAMYST PARTNERSHIP FINAL POSITION */'
          css=f'''\n<style id="yuna-partnership-final-position">\n{marker}\n@media (min-width:851px){{\n  #yunaPartnershipButton{{display:none!important}}\n  #yunaDesktopPartnershipButton{{display:flex!important;margin:0 0 12px!important;width:100%!important;max-width:none!important}}\n}}\n@media (max-width:850px){{\n  #yunaPartnershipButton{{display:flex!important}}\n  #yunaDesktopPartnershipButton{{display:none!important}}\n}}\n</style>\n'''
          s=re.sub(r'<style id="yuna-partnership-final-position">[\s\S]*?</style>\s*','',s,flags=re.I)
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Posicionar parceria ao lado da FAQ no PC'
          git push origin HEAD:main
