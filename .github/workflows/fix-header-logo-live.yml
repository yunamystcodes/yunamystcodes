name: Fix header logo live

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix-header:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ajustar logo do cabeçalho
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''
<style id="yuna-wide-header-final-fix">
/* YUNAMYST-WIDE-HEADER-FINAL-FIX */
.logo-mark{display:block!important;width:250px!important;height:62px!important;max-width:250px!important;max-height:62px!important;object-fit:contain!important;object-position:center!important;margin:0!important;flex:0 0 auto!important}
.logo-text{display:none!important}
.logo{display:flex!important;align-items:center!important;justify-content:flex-start!important;width:250px!important;height:76px!important;max-width:250px!important;max-height:76px!important;padding:0!important;margin:0!important;background:none!important;color:transparent!important;font-size:0!important;line-height:0!important;text-indent:0!important;overflow:hidden!important;white-space:nowrap!important;flex:0 0 auto!important}
.logo small{display:none!important}
.nav{height:76px!important;align-items:center!important}
@media(max-width:850px){.logo{width:220px!important;max-width:220px!important;height:68px!important;max-height:68px!important}.logo-mark{width:220px!important;max-width:220px!important;height:56px!important;max-height:56px!important}}
@media(max-width:600px){.nav{height:70px!important}.logo{width:195px!important;max-width:195px!important;height:64px!important;max-height:64px!important}.logo-mark{width:195px!important;max-width:195px!important;height:52px!important;max-height:52px!important}}
</style>
'''

          marker = 'YUNAMYST-WIDE-HEADER-FINAL-FIX'
          s = re.sub(r'<style id="yuna-wide-header-final-fix">.*?</style>', '', s, count=1, flags=re.I|re.S)
          css = css.replace('assets/yunamyst-header.svg?v=20260818-final', 'assets/yunamyst-mark.webp?v=20260818-header')
          s = re.sub(r'</head>', css + '</head>', s, count=1, flags=re.I)
          p.write_text(s, encoding='utf-8')

      - name: Commit ajuste no index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Cabeçalho já está ajustado"
            exit 0
          fi
          git commit -m "Ajustar logo larga no cabeçalho [skip ci]"
          git push origin main
