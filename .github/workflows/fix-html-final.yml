name: Corrigir parceria, códigos e cabeçalho
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fix-site-final
  cancel-in-progress: false
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar a imagem larga do cabeçalho
        run: |
          test -f "assets/ChatGPT Image 18_08_2026, 13_09_25.png"
          test -s "assets/ChatGPT Image 18_08_2026, 13_09_25.png"

      - name: Atualizar index sem alterar o restante do site
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          s = s.replace('Queres fazer uma parceria com o YunaMyst Codes?', 'Queres fazer uma parceria com a YunaMyst?')
          s = s.replace('Colabora com a YunaMyst Codes', 'Colabora com a YunaMyst')

          s = re.sub(r'\s*<a[^>]*id=["\']yunaDesktopPartnershipButton["\'][^>]*>\s*🤝\s*FAZER PARCERIA\s*</a>\s*', '\n', s, flags=re.I)

          codes = [
              ('YYDSSWC26ZAN', '2026-08-22T00:00:00', 'https://withhive.me/313/YYDSSWC26ZAN'),
              ('4MINGYIDAOXIAN', '2026-08-22T00:00:00', 'https://withhive.me/313/4MINGYIDAOXIAN'),
          ]
          insert_at = s.find('<div class="codes" id="activeCodesList">')
          if insert_at != -1:
              insert_at = s.find('>', insert_at) + 1
              cards = []
              for code, expiry, link in codes:
                  if f'data-code="{code}"' not in s:
                      cards.append(f'''<article class="code" data-code="{code}" data-expires="{expiry}"><div class="gift">🎁</div><div class="cinfo"><strong>{code}</strong><small>🆕 Código novo de 15/08/2026</small></div><div class="reward-icons" aria-label="Recompensas"><span class="reward-chip"><span class="reward-unknown">🎁</span><b>Recompensa do código</b></span></div><button class="copy" onclick="copiarCodigo('{code}',this)"><span data-i18n="copy">▣ COPIAR</span></button><a class="iphone" href="{link}" target="_blank" rel="noopener"><span class="iphone-full"> LINK IPHONE</span><span class="iphone-short"> LINK</span></a></article>''')
              if cards:
                  s = s[:insert_at] + ''.join(cards) + s[insert_at:]

          for ident in [
              'yunamyst-header-logo-final',
              'yunamyst-new-logo-final',
              'yuna-header-logo',
              'yunamyst-final-logo-override',
              'yunamyst-new-logo-wide'
          ]:
              s = re.sub(r'<style id="' + re.escape(ident) + r'">.*?</style>\s*', '', s, flags=re.S | re.I)
              s = re.sub(r'<script id="' + re.escape(ident) + r'">.*?</script>\s*', '', s, flags=re.S | re.I)

          version = '20260818-header-wide-image-6'
          image = 'assets/ChatGPT%20Image%2018_08_2026%2C%2013_09_25.png'
          css = f'''<style id="yunamyst-header-logo-final">
          /* YUNAMYST-WIDE-HEADER-{version} / trigger-7 */
          .logo {{
            width:420px !important;
            height:120px !important;
            max-width:45vw !important;
            display:block !important;
            background-image:url("{image}?v={version}") !important;
            background-size:contain !important;
            background-position:center !important;
            background-repeat:no-repeat !important;
            color:transparent !important;
            font-size:0 !important;
            line-height:0 !important;
            text-indent:-9999px !important;
            overflow:hidden !important;
          }}
          .logo small {{ display:none !important; }}
          @media(max-width:900px) {{
            .logo {{ width:340px !important; height:100px !important; max-width:48vw !important; }}
          }}
          @media(max-width:600px) {{
            .logo {{ width:280px !important; height:90px !important; max-width:58vw !important; }}
          }}
          </style>'''
          s = re.sub(r'</head>', css + '\n</head>', s, count=1, flags=re.I)

          if s != original:
              p.write_text(s, encoding='utf-8')
              print('ALTERADO')
          else:
              print('JA_CORRETO')
          PY

      - name: Validar
        run: |
          test -s "assets/ChatGPT Image 18_08_2026, 13_09_25.png"
          grep -q 'YUNAMYST-WIDE-HEADER-20260818-header-wide-image-6' index.html
          grep -q 'ChatGPT%20Image%2018_08_2026%2C%2013_09_25.png?v=20260818-header-wide-image-6' index.html

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git commit -m "Aplicar imagem larga definitiva no cabeçalho [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || true
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard origin/main
            sleep 3
          done
          exit 1
