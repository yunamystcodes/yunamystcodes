name: Fix index layout
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''
/* Final reward layout */
.reward-icons{display:flex!important;align-items:center;justify-content:center;gap:12px;min-width:0;flex-wrap:wrap}
.reward-img{width:32px!important;height:32px!important;display:inline-block!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important}
.reward-mystic{background-image:url("assets/rewards/mystic.svg")!important}.reward-fire{background-image:url("assets/rewards/fire.svg")!important}.reward-water{background-image:url("assets/rewards/water.svg")!important}.reward-wind{background-image:url("assets/rewards/wind.svg")!important}.reward-mana{background-image:url("assets/rewards/mana.svg")!important}.reward-crystal{background-image:url("assets/rewards/crystal.svg")!important}
@media(max-width:850px){.code{grid-template-columns:44px minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:12px;row-gap:12px}.code .gift{grid-column:1;grid-row:1}.code .cinfo{grid-column:2;grid-row:1}.code .reward-icons{grid-column:1 / -1;grid-row:2;justify-content:flex-start;display:flex!important;padding:0 0 2px;gap:10px}.code .copy{grid-column:1;grid-row:3;width:100%;margin:0}.code .iphone{grid-column:2;grid-row:3;width:100%;margin:0}.reward-img{width:30px!important;height:30px!important}.reward-chip b{font-size:11px}}
@media(max-width:600px){.reward-icons{gap:9px}.reward-img{width:30px!important;height:30px!important}.reward-chip b{font-size:10px}.code{padding:16px 14px 18px}}
.reward-chest{margin-top:12px;padding:18px;border-radius:18px;border:1px solid rgba(214,151,255,.38);background:linear-gradient(180deg,rgba(20,10,42,.96),rgba(7,5,20,.96));text-align:center;box-shadow:0 14px 35px rgba(0,0,0,.35)}.reward-chest .chest-icon{font-size:48px;line-height:1;display:block;margin-bottom:8px}.reward-chest strong{display:block;color:#f3c66c;font:900 20px Georgia,serif}.reward-chest span{display:block;color:#c8c0d2;font-size:12px;margin-top:5px}
'''
          if '/* Final reward layout */' not in s:
              s=s.replace('</style>',css+'</style>',1)
          chest='''<section class="panel reward-chest" id="recompensas"><div class="chest-icon" aria-hidden="true">🧰</div><strong>BAÚ DE RECOMPENSAS</strong><span>Confere as recompensas dos códigos antes de resgatar.</span></section>'''
          if 'class="reward-chest"' not in s:
              s=s.replace('</section><section class="panel faq" id="faq">','</section>'+chest+'<section class="panel faq" id="faq">',1)
          if 'id="mobile-faq"' in s and 'id="mobile-como"' in s and 'id="mobile-recompensas"' not in s:
              mobile=chest.replace('id="recompensas"','id="mobile-recompensas"')
              s=s.replace('</section><section class="panel faq" id="mobile-faq">','</section>'+mobile+'<section class="panel faq" id="mobile-faq">',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'Fix recompensas no PC e telemovel e adicionar bau'; git push; fi
