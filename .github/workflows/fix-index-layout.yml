name: Fix index layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-index-layout.yml'
      - 'index.html'
      - 'assets/rewards/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          css = r'''
/* Final reward layout: real transparent symbols, visible on desktop and mobile */
.reward-icons{display:flex!important;align-items:center;justify-content:center;gap:12px;min-width:0;flex-wrap:wrap}
.reward-img{width:32px!important;height:32px!important;display:inline-block!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important}
.reward-mystic{background-image:url("assets/rewards/mystic.svg")!important}
.reward-fire{background-image:url("assets/rewards/fire.svg")!important}
.reward-water{background-image:url("assets/rewards/water.svg")!important}
.reward-wind{background-image:url("assets/rewards/wind.svg")!important}
.reward-mana{background-image:url("assets/rewards/mana.svg")!important}
.reward-crystal{background-image:url("assets/rewards/crystal.svg")!important}
.reward-chip b{font-size:12px;color:#fff}
@media(max-width:1050px){.reward-icons{grid-column:3 / 5;display:flex!important}}
@media(max-width:850px){.code{grid-template-columns:44px minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:12px;row-gap:12px}.code .gift{grid-column:1;grid-row:1}.code .cinfo{grid-column:2;grid-row:1}.code .reward-icons{grid-column:1 / -1;grid-row:2;justify-content:flex-start;display:flex!important;padding:0 0 2px;gap:10px}.code .copy{grid-column:1;grid-row:3;width:100%;margin:0}.code .iphone{grid-column:2;grid-row:3;width:100%;margin:0}.reward-img{width:30px!important;height:30px!important}.reward-chip b{font-size:11px}}
@media(max-width:600px){.reward-icons{gap:9px}.reward-img{width:30px!important;height:30px!important}.reward-chip b{font-size:10px}.code{padding:16px 14px 18px}}
/* Baú entre COMO USAR e FAQ */
.reward-chest{margin-top:12px;padding:18px;border-radius:18px;border:1px solid rgba(214,151,255,.38);background:linear-gradient(180deg,rgba(20,10,42,.96),rgba(7,5,20,.96));text-align:center;box-shadow:0 14px 35px rgba(0,0,0,.35)}
.reward-chest .chest-icon{font-size:48px;line-height:1;display:block;margin-bottom:8px;filter:drop-shadow(0 0 10px rgba(243,189,82,.35))}
.reward-chest strong{display:block;color:#f3c66c;font:900 20px Georgia,serif}.reward-chest span{display:block;color:#c8c0d2;font-size:12px;margin-top:5px}
@media(max-width:850px){.reward-chest{margin-top:18px}}
'''
          if '/* Final reward layout: real transparent symbols' not in s:
              s = s.replace(marker, css + '\n' + marker, 1)
          chest = '''<section class="panel reward-chest" id="recompensas">
<div class="chest-icon" aria-hidden="true">🧰</div>
<strong data-i18n="chestTitle">BAÚ DE RECOMPENSAS</strong>
<span data-i18n="chestText">Confere as recompensas dos códigos antes de resgatar.</span>
</section>'''
          if 'class="reward-chest"' not in s:
              needle = '</section><section class="panel faq" id="faq">'
              s = s.replace(needle, '</section>' + chest + '<section class="panel faq" id="faq">', 1)
          if s.count('class="reward-chest"') == 1 and 'id="mobile-faq"' in s and 'id="mobile-como"' in s:
              needle = '</section><section class="panel faq" id="mobile-faq">'
              s = s.replace(needle, '</section>' + chest.replace('id="recompensas"','id="mobile-recompensas"') + '<section class="panel faq" id="mobile-faq">', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix recompensas no PC e telemovel e adicionar bau'
          git push
