name: Fix index layout
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências para limpeza dos códigos
        run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Patch index
        run: python scripts/patch_index_layout.py
      - name: Limpar imediatamente a lista de códigos expirados
        run: python scripts/auto_update_codes_fixed.py
      - name: Ajustar botoes mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''\n@media(max-width:600px){.code{grid-template-columns:44px minmax(0,1fr) 88px 96px!important;gap:10px!important}.code .copy{grid-column:3!important;width:88px!important;min-width:88px!important;max-width:88px!important;margin-left:0!important;justify-self:start!important}.code .iphone{grid-column:4!important;width:96px!important;min-width:96px!important;max-width:96px!important;margin-left:0!important;justify-self:start!important}}\n@media(max-width:380px){.code{grid-template-columns:40px minmax(0,1fr) 82px 90px!important;gap:9px!important}.code .copy{width:82px!important;min-width:82px!important;max-width:82px!important}.code .iphone{width:90px!important;min-width:90px!important;max-width:90px!important}}\n'''
          if 'Ajuste final botoes mobile' not in s:
              s = s.replace('</style>', '/* Ajuste final botoes mobile */'+css+'</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/code_history.json
          if ! git diff --cached --quiet; then git commit -m 'Remover códigos expirados da lista ativa [skip ci]'; git push; fi
