name: Fixar nova logo no site

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-logo-final
  cancel-in-progress: false

jobs:
  fix-logo:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar nova logo no perfil e cabeçalho
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          if not p.exists():
              raise SystemExit('index.html não encontrado')

          s = p.read_text(encoding='utf-8')
          version = '20260818-header-final-2'

          # Remove overrides antigos para não acumular scripts/estilos conflitantes.
          s = re.sub(r'<script id="yunamyst-final-logo-override">.*?</script>\s*', '', s, flags=re.S | re.I)
          s = re.sub(r'<style id="yunamyst-new-logo-final">.*?</style>\s*', '', s, flags=re.S | re.I)

          css = f'''<style id="yunamyst-header-logo-final">
          /* YUNAMYST-HEADER-LOGO-FINAL-{version} */
          .logo {{
            width:190px !important;
            height:62px !important;
            display:block !important;
            background-image:url("assets/yunamyst-mark.webp?v={version}") !important;
            background-size:contain !important;
            background-position:center !important;
            background-repeat:no-repeat !important;
            color:transparent !important;
            font-size:0 !important;
            line-height:0 !important;
            text-indent:-9999px !important;
            overflow:hidden !important;
          }}
          .logo small {{ display:none !important; }}
          .avatar, .profile .avatar, .mobile-profile .avatar {{
            background-image:url("assets/yunamyst-mark.webp?v={version}") !important;
            background-size:cover !important;
            background-position:center !important;
            background-repeat:no-repeat !important;
            color:transparent !important;
            font-size:0 !important;
            text-indent:-9999px !important;
            overflow:hidden !important;
          }}
          @media(max-width:600px) {{
            .logo {{ width:145px !important; height:58px !important; }}
          }}
          </style>'''

          if '</head>' not in s.lower():
              raise SystemExit('</head> não encontrado')
          s = re.sub(r'</head>', css + '\n</head>', s, count=1, flags=re.I)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validar HTML
        run: |
          grep -q 'yunamyst-header-logo-final' index.html
          grep -q 'assets/yunamyst-mark.webp?v=20260818-header-final-2' index.html
          echo 'Nova logo aplicada ao cabeçalho e perfil.'

      - name: Commit e publicar com retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-logo-final.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git commit -m "Aplicar nova logo no cabeçalho [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 3
          done
          echo "Não foi possível publicar após 5 tentativas"
          exit 1
