name: Fixar cabeçalho com nova logo

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-logo-final
  cancel-in-progress: false

jobs:
  fix-logo:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar a logo larga somente no cabeçalho
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          if not p.exists():
              raise SystemExit('index.html não encontrado')

          s = p.read_text(encoding='utf-8')
          version = '20260818-wide-header-1'

          # Remove os overrides anteriores do cabeçalho, sem alterar a logo circular do perfil.
          s = re.sub(r'<style id="yunamyst-header-logo-final">.*?</style>\s*', '', s, flags=re.S | re.I)
          s = re.sub(r'<style id="yunamyst-new-logo-final">.*?</style>\s*', '', s, flags=re.S | re.I)
          s = re.sub(r'<script id="yunamyst-final-logo-override">.*?</script>\s*', '', s, flags=re.S | re.I)

          # Nova imagem larga enviada para o cabeçalho.
          image_b64 = ''''''

          css = f'''<style id="yunamyst-header-logo-final">
          /* YUNAMYST-WIDE-HEADER-{version} */
          .logo {{
            width: 230px !important;
            height: 70px !important;
            display: block !important;
            background-image: url("data:image/webp;base64,{image_b64}") !important;
            background-size: contain !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            color: transparent !important;
            font-size: 0 !important;
            line-height: 0 !important;
            text-indent: -9999px !important;
            overflow: hidden !important;
          }}
          .logo small {{ display: none !important; }}
          @media(max-width:600px) {{
            .logo {{ width: 175px !important; height: 58px !important; }}
          }}
          </style>'''

          if '</head>' not in s.lower():
              raise SystemExit('</head> não encontrado')
          s = re.sub(r'</head>', css + '\n</head>', s, count=1, flags=re.I)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validar
        run: |
          grep -q 'yunamyst-header-logo-final' index.html
          grep -q 'YUNAMYST-WIDE-HEADER' index.html
          echo 'Cabeçalho atualizado; logo circular do perfil preservada.'

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git commit -m "Aplicar nova logo larga no cabeçalho [skip ci]"
          git push origin HEAD:main
