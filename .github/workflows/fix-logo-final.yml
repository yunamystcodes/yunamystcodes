name: Aplicar logo no cabeçalho

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-logo-final
  cancel-in-progress: false

jobs:
  fix-logo:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar o ficheiro da nova logo do cabeçalho
        run: |
          test -f assets/yunamyst-header-small.webp.b64
          base64 -d assets/yunamyst-header-small.webp.b64 > assets/yunamyst-header-small.webp
          test -s assets/yunamyst-header-small.webp

      - name: Aplicar cabeçalho preto com logo compacta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          for ident in [
              'yunamyst-header-logo-final',
              'yunamyst-new-logo-final',
              'yuna-header-logo',
              'yunamyst-final-logo-override',
              'yunamyst-new-logo-wide'
          ]:
              s = re.sub(r'<style id="' + re.escape(ident) + r'">.*?</style>\s*', '', s, flags=re.S | re.I)
              s = re.sub(r'<script id="' + re.escape(ident) + r'">.*?</script>\s*', '', s, flags=re.S | re.I)

          version = '20260819-header-clean-1'
          css = f'''<style id="yunamyst-header-logo-final">
          /* YUNAMYST-CLEAN-HEADER-{version} */
          .topbar {{
            height:70px !important;
            background:#000 !important;
            background-image:none !important;
            backdrop-filter:none !important;
            -webkit-backdrop-filter:none !important;
            border-bottom:1px solid rgba(255,255,255,.12) !important;
          }}
          .nav {{ height:70px !important; min-height:70px !important; align-items:center !important; }}
          .logo {{
            width:230px !important;
            max-width:230px !important;
            height:64px !important;
            max-height:64px !important;
            display:flex !important;
            align-items:center !important;
            justify-content:flex-start !important;
            background-image:url("assets/yunamyst-header-small.webp?v={version}") !important;
            background-size:contain !important;
            background-position:left center !important;
            background-repeat:no-repeat !important;
            background-color:transparent !important;
            color:transparent !important;
            font-size:0 !important;
            line-height:0 !important;
            text-indent:-9999px !important;
            overflow:hidden !important;
            flex:0 0 auto !important;
            margin:0 !important;
            padding:0 !important;
          }}
          .logo img {{ display:none !important; }}
          .logo small {{ display:none !important; }}
          @media(max-width:850px) {{
            .topbar {{ height:66px !important; }}
            .nav {{ height:66px !important; min-height:66px !important; }}
            .logo {{ width:205px !important; max-width:205px !important; height:58px !important; max-height:58px !important; }}
          }}
          @media(max-width:600px) {{
            .topbar {{ height:62px !important; }}
            .nav {{ height:62px !important; min-height:62px !important; }}
            .logo {{ width:190px !important; max-width:190px !important; height:56px !important; max-height:56px !important; }}
          }}
          </style>'''
          s = re.sub(r'</head>', css + '\n</head>', s, count=1, flags=re.I)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validar
        run: |
          test -s assets/yunamyst-header-small.webp
          grep -q 'YUNAMYST-CLEAN-HEADER-20260819-header-clean-1' index.html
          grep -q 'width:230px' index.html
          grep -q 'height:64px' index.html

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/yunamyst-header-small.webp
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git commit -m "Ajustar logo do cabeçalho para tamanho compacto [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || true
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard origin/main
            sleep 3
          done
          exit 1
