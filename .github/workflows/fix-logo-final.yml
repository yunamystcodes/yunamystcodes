name: Aplicar logo correta no cabeçalho

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-logo-final
  cancel-in-progress: false

jobs:
  fix-logo:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar imagem do cabeçalho
        run: |
          test -f assets/yunamyst-header-small.webp.b64
          base64 -d assets/yunamyst-header-small.webp.b64 > assets/yunamyst-header-small.webp
          test -s assets/yunamyst-header-small.webp
      - name: Corrigir somente o cabeçalho
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          for ident in ['yunamyst-header-logo-final','yunamyst-new-logo-final','yuna-header-logo','yunamyst-final-logo-override','yunamyst-new-logo-wide','yuna-wide-header-final-fix']:
              s=re.sub(r'<style id="'+re.escape(ident)+r'">.*?</style>\\s*','',s,flags=re.S|re.I)
          css='''<style id="yunamyst-header-logo-final">\n/* CABECALHO FINAL: logo maior, sem SUMMONERS WAR */\n.logo{width:360px!important;max-width:42vw!important;height:64px!important;display:block!important;background-image:url("assets/yunamyst-header-small.webp?v=20260819-final")!important;background-size:100% auto!important;background-position:left top!important;background-repeat:no-repeat!important;color:transparent!important;font-size:0!important;line-height:0!important;text-indent:-9999px!important;overflow:hidden!important;clip-path:inset(0 0 13px 0)!important}\n.logo small,.logo-mark,.logo-text{display:none!important}\n@media(max-width:900px){.logo{width:300px!important;max-width:50vw!important;height:60px!important}}\n@media(max-width:600px){.logo{width:250px!important;max-width:62vw!important;height:56px!important;clip-path:inset(0 0 11px 0)!important}}\n</style>'''
          s=re.sub(r'</head>',css+'\n</head>',s,count=1,flags=re.I)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/yunamyst-header-small.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrigir cabeçalho final [skip ci]"
          git push origin HEAD:main
