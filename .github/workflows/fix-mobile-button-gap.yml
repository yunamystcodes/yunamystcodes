name: Ajustar espaço dos botões no telemóvel

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar espaço dos botões
        run: |
          sed -i 's/margin-left:14px/margin-left:10px/g' index.html
          sed -i 's/margin-left:10px/margin-left:10px/g' index.html
      - name: Guardar alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Ajustar espaço entre copiar e link no telemóvel'
            git push
          fi
