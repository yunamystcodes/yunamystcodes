name: Final mobile button spacing
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''\n<style id="mobile-button-final-fix">\n@media (max-width:600px){\n  .code .copy{grid-column:1 / 2!important;width:88px!important;min-width:88px!important;max-width:88px!important;margin:0!important;justify-self:start!important}\n  .code .iphone{grid-column:2 / 3!important;width:96px!important;min-width:96px!important;max-width:96px!important;margin:0 0 0 8px!important;justify-self:start!important}\n}\n</style>\n'''
          if 'mobile-button-final-fix' not in s:
              s = s.replace('</head>', css + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'Ajustar botoes copiar e link no telemovel'; git push; fi
