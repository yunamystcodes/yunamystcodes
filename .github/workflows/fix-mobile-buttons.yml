name: Ajustar botoes no telemovel
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aproximar botoes copiar e link
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="mobile-buttons-separation">'
          css = '''<style id="mobile-buttons-separation">
          @media (max-width:600px){
            .code{position:relative!important;padding-bottom:72px!important}
            .code .copy{position:absolute!important;left:12px!important;bottom:18px!important;width:88px!important;min-width:88px!important;max-width:88px!important;margin:0!important;padding:9px 6px!important;font-size:10px!important;justify-self:auto!important;grid-column:auto!important;grid-row:auto!important}
            .code .iphone{position:absolute!important;left:110px!important;bottom:18px!important;width:96px!important;min-width:96px!important;max-width:96px!important;margin:0!important;padding:9px 6px!important;font-size:10px!important;justify-self:auto!important;grid-column:auto!important;grid-row:auto!important}
          }
          @media (max-width:380px){
            .code .copy{left:10px!important;width:82px!important;min-width:82px!important;max-width:82px!important;font-size:9px!important;padding:8px 5px!important}
            .code .iphone{left:102px!important;width:90px!important;min-width:90px!important;max-width:90px!important;font-size:9px!important;padding:8px 5px!important}
          }
          </style>'''
          if marker in s:
              start = s.index(marker)
              end = s.index('</style>', start) + len('</style>')
              s = s[:start] + css + s[end:]
          else:
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'Aproximar botoes copiar e link no telemovel'; git push; fi
