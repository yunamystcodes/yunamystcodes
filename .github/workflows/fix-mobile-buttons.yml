name: Ajustar botoes no telemovel
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir layout mobile completo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''<style id="mobile-buttons-separation">\n@media (max-width:600px){\n  .codes .code{display:grid!important;grid-template-columns:44px minmax(0,1fr)!important;grid-template-rows:auto auto auto!important;column-gap:8px!important;row-gap:10px!important;align-items:center!important;position:relative!important;padding:15px 10px!important;min-height:0!important}\n  .codes .code .gift{grid-column:1!important;grid-row:1!important;width:44px!important;height:44px!important;align-self:start!important}\n  .codes .code .cinfo{grid-column:2!important;grid-row:1!important;min-width:0!important;align-self:center!important}\n  .codes .code .cinfo strong{font-size:16px!important;line-height:1.15!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}\n  .codes .code .reward-icons{grid-column:1 / 3!important;grid-row:2!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;flex-wrap:nowrap!important;gap:10px!important;width:100%!important;min-width:0!important;padding:0!important;margin:0!important;position:static!important;order:initial!important;visibility:visible!important;opacity:1!important}\n  .codes .code .reward-chip{display:inline-flex!important;align-items:center!important;gap:4px!important;flex:0 0 auto!important;white-space:nowrap!important}\n  .codes .code .reward-img{width:30px!important;height:30px!important;flex:0 0 30px!important;display:inline-block!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important}\n  .codes .code .reward-energy{width:30px!important;height:30px!important;flex:0 0 30px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;font-size:22px!important;line-height:30px!important}\n  .codes .code .reward-chip b{display:inline!important;font-size:11px!important;color:#fff!important;white-space:nowrap!important}\n  .codes .code .copy,.codes .code .iphone{grid-row:3!important;position:static!important;height:44px!important;margin:0!important;width:100%!important;min-width:0!important;max-width:none!important;justify-self:stretch!important;align-self:center!important;padding:0 8px!important;font-size:12px!important;box-sizing:border-box!important}\n  .codes .code .copy{grid-column:1!important}.codes .code .iphone{grid-column:2!important}\n}\n@media (max-width:380px){.codes .code{grid-template-columns:40px minmax(0,1fr)!important;column-gap:7px!important;row-gap:8px!important;padding:13px 8px!important}.codes .code .gift{width:40px!important;height:40px!important}.codes .code .cinfo strong{font-size:14px!important}.codes .code .reward-icons{gap:7px!important}.codes .code .reward-img,.codes .code .reward-energy{width:27px!important;height:27px!important;flex-basis:27px!important}.codes .code .reward-chip b{font-size:10px!important}.codes .code .copy,.codes .code .iphone{height:42px!important;font-size:11px!important}}\n</style>'''
          marker = '<style id="mobile-buttons-separation">'
          if marker in s:
              start = s.index(marker)
              end = s.index('</style>', start) + len('</style>')
              s = s[:start] + css + s[end:]
          else:
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'Corrigir layout mobile das recompensas'; git push; fi
