name: Fix mobile copy and link buttons
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep mobile buttons together
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="mobile-buttons-separation">'
          css = '''<style id="mobile-buttons-separation">
          @media (max-width:600px){
            .code .copy,.code .iphone{margin:0!important}
            .code .copy{grid-column:1 / 2!important;grid-row:3!important;width:100%!important;min-width:0!important;max-width:none!important;justify-self:stretch!important}
            .code .iphone{grid-column:2 / 3!important;grid-row:3!important;width:100%!important;min-width:0!important;max-width:none!important;justify-self:stretch!important}
            .code{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;column-gap:6px!important;row-gap:12px!important}
            .code .gift{grid-column:1!important;grid-row:1!important;justify-self:start!important}
            .code .cinfo{grid-column:1 / 3!important;grid-row:1!important;padding-left:54px!important}
            .code .reward{grid-column:1 / 3!important;grid-row:2!important}
          }
          @media (max-width:380px){
            .code{column-gap:4px!important;row-gap:10px!important}
          }
          </style>'''
          if marker in s:
              start=s.index(marker)
              end=s.index('</style>',start)+len('</style>')
              s=s[:start]+css+s[end:]
          else:
              s=s.replace('</head>',css+'</head>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'Fix mobile copy and link button spacing'; git push; fi
