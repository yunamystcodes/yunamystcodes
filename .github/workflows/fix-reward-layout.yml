name: Corrigir recompensas e bau no index

on:
  push:
    paths:
      - '.github/workflows/fix-reward-layout.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          m = re.search(r'background-image:url\("(data:image/png;base64,[^"]+)"\)', text)
          if not m:
              raise SystemExit('PNG de recompensas não encontrado')
          sprite = m.group(1)

          text = re.sub(r'\n<style id="reward-layout-fix">.*?</style>', '', text, flags=re.S)
          css = '''
<style id="reward-layout-fix">
.reward-icons{display:flex!important;visibility:visible!important;opacity:1!important;align-items:center!important;justify-content:center!important;gap:12px!important;flex-wrap:wrap!important}
.reward-chip{display:inline-flex!important;align-items:center!important;gap:5px!important;white-space:nowrap!important}
.reward-img{display:inline-block!important;width:32px!important;height:32px!important;flex:none!important;background-image:url("__SPRITE__")!important;background-repeat:no-repeat!important;background-size:192px 32px!important;background-position-y:0!important}
.reward-mystic{background-position-x:0!important}.reward-fire{background-position-x:-32px!important}.reward-water{background-position-x:-64px!important}.reward-wind{background-position-x:-96px!important}.reward-mana{background-position-x:-128px!important}.reward-crystal{background-position-x:-160px!important}
.reward-chip b{font-size:12px!important;color:#fff!important}.reward-energy{display:inline-block!important;width:32px!important;height:32px!important;font-size:25px!important;line-height:32px!important;text-align:center}
.right>.gamebox{margin-top:12px!important;padding:18px!important;text-align:center!important;color:#bcb2ca!important;background:linear-gradient(180deg,rgba(11,8,29,.94),rgba(6,5,18,.92))!important;border:1px solid var(--line)!important;border-radius:18px!important;box-shadow:0 20px 50px rgba(0,0,0,.35)!important}
@media(max-width:850px){.reward-icons{grid-column:1 / 3!important;grid-row:2!important;justify-content:center!important}.reward-img{width:30px!important;height:30px!important;background-size:180px 30px!important}.reward-mystic{background-position-x:0!important}.reward-fire{background-position-x:-30px!important}.reward-water{background-position-x:-60px!important}.reward-wind{background-position-x:-90px!important}.reward-mana{background-position-x:-120px!important}.reward-crystal{background-position-x:-150px!important}.reward-energy{width:30px!important;height:30px!important;font-size:22px!important;line-height:30px!important}}
@media(max-width:600px){.code{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;grid-template-rows:auto auto auto!important;column-gap:20px!important;row-gap:12px!important}.code .gift{grid-column:1!important;grid-row:1!important}.code .cinfo{grid-column:2!important;grid-row:1!important}.code .reward-icons{grid-column:1 / 3!important;grid-row:2!important;min-height:34px!important}.code .copy{grid-column:1!important;grid-row:3!important}.code .iphone{grid-column:2!important;grid-row:3!important;margin:0!important}}
</style>
'''.replace('__SPRITE__', sprite)
          text = text.replace('</head>', css + '</head>', 1)

          gm = re.search(r'<div class="gamebox">.*?</div>', text, flags=re.S)
          if gm:
              box = gm.group(0)
              text = text[:gm.start()] + text[gm.end():]
              marker = '</section><section class="panel faq" id="faq">'
              if marker in text:
                  text = text.replace(marker, '</section>' + box + '<section class="panel faq" id="faq">', 1)

          p.write_text(text, encoding='utf-8')

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Corrigir simbolos das recompensas e posicionar bau"
          git push