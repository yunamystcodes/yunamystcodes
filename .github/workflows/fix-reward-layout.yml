name: Corrigir layout das recompensas

on:
  push:
    paths:
      - '.github/workflows/fix-reward-layout.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Limpar baus e corrigir layout
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Remove qualquer baú/gamebox antigo ou duplicado.
          text = re.sub(r'\s*<section class="panel reward-chest"[^>]*>.*?</section>', '', text, flags=re.S)
          text = re.sub(r'\s*<div class="reward-chest"[^>]*>.*?</div>', '', text, flags=re.S)
          text = re.sub(r'\s*<div class="gamebox"[^>]*>.*?</div>', '', text, flags=re.S)

          # Substitui o nosso override anterior para não acumular CSS a cada execução.
          override = r'''<style id="reward-layout-fix">
          /* Layout limpo das recompensas no PC */
          @media (min-width:851px){
            .code{display:flex!important;flex-wrap:wrap!important;align-items:center!important;gap:10px!important;padding:14px 12px!important}
            .code .gift{flex:0 0 52px!important}
            .code .cinfo{flex:1 1 150px!important;min-width:140px!important}
            .code .reward{display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:6px!important;flex:0 0 auto!important;min-width:52px!important;text-align:left!important}
            .code .reward .ico{width:38px!important;height:38px!important;margin:0!important;flex:0 0 38px!important}
            .code .reward .ico img{width:38px!important;height:38px!important;object-fit:contain!important;display:block!important}
            .code .reward b{font-size:13px!important;white-space:nowrap!important}
            .code .reward small{display:none!important}
            .code .copy,.code .iphone{flex:0 0 auto!important;min-width:82px!important}
          }

          /* Layout limpo das recompensas no telemóvel: código em cima,
             quantidades numa linha própria e botões separados em baixo. */
          @media (max-width:850px){
            .code{display:grid!important;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)!important;grid-template-rows:auto auto auto!important;gap:9px!important;padding:15px 12px!important;align-items:center!important}
            .code .gift{grid-column:1!important;grid-row:1!important;width:44px!important;height:44px!important}
            .code .cinfo{grid-column:2 / 5!important;grid-row:1!important;min-width:0!important}
            .code .cinfo strong{font-size:16px!important;line-height:1.15!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
            .code .cinfo small{font-size:10px!important;margin-top:3px!important}
            .code .reward{grid-row:2!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:5px!important;min-width:0!important;text-align:center!important}
            .code .reward .ico{display:none!important}
            .code .reward b{font-size:12px!important;white-space:nowrap!important}
            .code .reward small{display:none!important}
            .code .copy{grid-column:1 / 3!important;grid-row:3!important;width:auto!important;min-width:0!important;margin:0!important;justify-self:stretch!important}
            .code .iphone{grid-column:3 / 5!important;grid-row:3!important;width:auto!important;min-width:0!important;margin:0!important;justify-self:stretch!important}
          }

          @media (max-width:380px){
            .code{grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)!important;gap:7px!important;padding:13px 9px!important}
            .code .gift{width:40px!important;height:40px!important}
            .code .cinfo strong{font-size:14px!important}
            .code .reward b{font-size:11px!important}
            .code .copy,.code .iphone{font-size:10px!important;padding:8px 5px!important}
          }
          </style>'''

          text = re.sub(r'\s*<style id="reward-layout-fix">.*?</style>', '', text, flags=re.S)
          if '</head>' in text:
              text = text.replace('</head>', override + '\n</head>', 1)
          else:
              text = override + text

          p.write_text(text, encoding='utf-8')

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Corrigir layout das recompensas no PC e telemovel"
          git push
