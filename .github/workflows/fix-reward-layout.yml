name: Limpar baus e corrigir recompensas

on:
  push:
    paths:
      - '.github/workflows/fix-reward-layout.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Limpar baus e gamebox
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'\s*<section class="panel reward-chest"[^>]*>.*?</section>', '', text, flags=re.S)
          text = re.sub(r'\s*<div class="reward-chest"[^>]*>.*?</div>', '', text, flags=re.S)
          text = re.sub(r'\s*<div class="gamebox"[^>]*>.*?</div>', '', text, flags=re.S)
          p.write_text(text, encoding='utf-8')

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remover baus duplicados do index"
          git push
