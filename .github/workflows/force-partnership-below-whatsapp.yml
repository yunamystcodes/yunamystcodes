name: Proteger layout da parceria

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  partnership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remover botão dourado legado e manter texto correto
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('Queres fazer uma parceria com o YunaMyst Codes?', 'Queres fazer uma parceria com a YunaMyst?')
          s = s.replace('Queres fazer uma parceria com a YunaMyst Codes?', 'Queres fazer uma parceria com a YunaMyst?')
          s = s.replace('Colabora com a YunaMyst Codes', 'Colabora com a YunaMyst')

          # O workflow antigo criava um segundo botão dourado abaixo do WhatsApp.
          s = re.sub(r'\s*<a[^>]*id=["\']yunaDesktopPartnershipButton["\'][^>]*>\s*🤝\s*FAZER PARCERIA\s*</a>\s*', '\n', s, flags=re.I)
          s = re.sub(r'\s*<a[^>]*class=["\'][^"\']*yuna-partnership-below-whatsapp[^"\']*["\'][^>]*>[\s\S]*?</a>\s*', '\n', s, flags=re.I)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remover parceria duplicada e manter layout'
          git push origin HEAD:main
