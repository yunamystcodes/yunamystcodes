name: Fix YunaMyst header

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-header:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir cabeçalho do index
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          # Troca o logo textual/antigo pelo banner correto, sem alterar o restante do site.
          pattern = r'<([A-Za-z0-9]+)([^>]*class=["\'][^"\']*\blogo\b[^"\']*["\'][^>]*)>.*?</\1>'
          replacement = '<a class="logo" href="/"><img src="assets/yunamyst-header.webp?v=3" alt="YunaMyst Summoners War"></a>'
          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S | re.I)
          if count != 1 and 'assets/yunamyst-header.webp' not in text:
              raise SystemExit("Não encontrei o elemento .logo no index.html")
          if count == 1:
              text = new_text

          # Mantém toda a barra numa única cor e impede que a imagem fique enorme.
          css = '''
/* FIX HEADER YUNAMYST */
.topbar{height:70px!important;background:#000!important;background-image:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-bottom:1px solid rgba(255,255,255,.12)!important}
.nav{height:70px!important;min-height:70px!important}
.logo{width:230px!important;height:64px!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;flex:none!important;margin:0!important;padding:0!important;background:transparent!important;border:0!important;box-shadow:none!important;text-shadow:none!important;overflow:hidden!important}
.logo img{width:230px!important;height:64px!important;max-width:230px!important;max-height:64px!important;display:block!important;object-fit:contain!important;object-position:left center!important;margin:0!important;padding:0!important;border:0!important;box-shadow:none!important}
.logo small{display:none!important}
@media(max-width:850px){.topbar{height:66px!important}.nav{height:66px!important;min-height:66px!important}.logo{width:205px!important;height:58px!important}.logo img{width:205px!important;height:58px!important;max-width:205px!important;max-height:58px!important}}
@media(max-width:600px){.logo{width:190px!important;height:56px!important}.logo img{width:190px!important;height:56px!important;max-width:190px!important;max-height:56px!important}}
'''
          if '/* FIX HEADER YUNAMYST */' not in text:
              text = text.replace('</style>', css + '</style>', 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit index corrigido
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Index já está corrigido."
            exit 0
          fi
          git commit -m "Corrigir cabeçalho e logo do site [skip ci]"
          git push
