name: Install YunaMyst header logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-header-logo:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply new logo to header
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          old = '<div class="logo">YunaMyst<small>SUMMONERS WAR</small></div>'
          new = '<div class="logo"><img class="logo-mark" src="assets/yunamyst-mark.webp" alt="YunaMyst"><span class="logo-text">YunaMyst<small>SUMMONERS WAR</small></span></div>'

          if old in s:
              s = s.replace(old, new, 1)
          elif 'class="logo-mark"' in s:
              print('Header logo already installed')
          else:
              raise SystemExit('Original header logo was not found')

          style = '''\n<style id="yuna-header-logo">\n.logo{display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;gap:10px!important;white-space:nowrap!important;line-height:1!important}\n.logo-mark{width:52px!important;height:52px!important;border-radius:50%!important;object-fit:cover!important;border:2px solid #a85cff!important;box-shadow:0 0 18px rgba(168,92,255,.55)!important;display:block!important;flex:none!important}\n.logo-text{display:flex!important;flex-direction:column!important;align-items:flex-start!important;font-family:Georgia,serif!important;font-size:36px!important;font-weight:900!important;letter-spacing:1px!important;line-height:.9!important;text-shadow:0 0 18px #8b45ff!important}\n.logo-text small{display:block!important;width:auto!important;font:700 8px Arial!important;letter-spacing:4px!important;color:#f1ca76!important;text-align:left!important;margin-top:5px!important;line-height:1.1!important}\n@media(max-width:600px){.logo{gap:8px!important}.logo-mark{width:46px!important;height:46px!important}.logo-text{font-size:28px!important}.logo-text small{font-size:7px!important;letter-spacing:3px!important;margin-top:4px!important}}\n</style>\n'''
          if 'id="yuna-header-logo"' not in s:
              s = s.replace('</head>', style + '</head>', 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit header logo change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No header changes needed"; exit 0; fi
          git commit -m "Aplicar nova logo no cabeçalho [skip ci]"
          git push
