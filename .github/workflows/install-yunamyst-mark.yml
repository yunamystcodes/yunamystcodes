name: Install YunaMyst mark

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-mark:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install mark image and patch avatar
        env:
          MARK_B64: 
          PATCH_B64: 
        run: |
          mkdir -p assets
          printf '%s' "$MARK_B64" | base64 -d > assets/yunamyst-mark.webp
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/yunamyst-mark.webp index.html
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "Adicionar nova marca YunaMyst [skip ci]"
          git push
