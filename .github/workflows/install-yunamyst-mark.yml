name: Install YunaMyst mark

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-mark:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync updates.js with the selected logo asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          asset = Path('assets/yunamyst-mark.webp')
          p = Path('updates.js')
          if not asset.exists():
              raise SystemExit('assets/yunamyst-mark.webp not found')
          s = p.read_text(encoding='utf-8')
          b64 = base64.b64encode(asset.read_bytes()).decode('ascii')
          data_uri = 'data:image/webp;base64,' + b64
          s2, n = re.subn(r"var logoData='data:image/webp;base64,[^']+'", "var logoData='" + data_uri + "'", s, count=1)
          if n != 1:
              raise SystemExit('logoData not found in updates.js')
          p.write_text(s2, encoding='utf-8')
          print('updates.js sincronizado com assets/yunamyst-mark.webp')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.js
          git diff --cached --quiet || git commit -m "Sync YunaMyst mark from selected asset [skip ci]"
          git push
