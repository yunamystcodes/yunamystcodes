name: Manter parceria responsiva

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/mobile-partnership-only.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manter apenas o texto final da parceria
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Queres fazer uma parceria com o YunaMyst Codes?', 'Queres fazer uma parceria com a YunaMyst?')
          s = s.replace('Queres fazer uma parceria com a YunaMyst Codes?', 'Queres fazer uma parceria com a YunaMyst?')
          s = s.replace('Colabora com a YunaMyst Codes', 'Colabora com a YunaMyst')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Manter texto final da parceria'
          git push origin HEAD:main
