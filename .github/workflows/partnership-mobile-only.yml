name: Corrigir parceria PC e telemóvel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/partnership-mobile-only.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir apenas parceria PC e telemóvel
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Queres fazer uma parceria com o YunaMyst Codes?', 'Queres fazer uma parceria com a YunaMyst?')
          s = s.replace('Colabora com a YunaMyst Codes', 'Colabora com a YunaMyst')
          desktop = '<a href="#" class="partnership partnership-desktop" id="yunaDesktopPartnershipButton" aria-label="Abrir informações de parceria"><span class="picon">🤝</span><span><b>FAZER PARCERIA</b><small>Colabora com a YunaMyst</small></span><strong>›</strong></a>\n'
          pat = r'<a href="#" class="partnership partnership-desktop" id="yunaDesktopPartnershipButton"[\s\S]*?</a>\s*'
          s = re.sub(pat, '', s, count=1, flags=re.I)
          target = '<section class="panel faq" id="faq">'
          if target in s:
              s = s.replace(target, desktop + target, 1)
          mobile = '<a href="#" class="partnership" id="yunaPartnershipButton" aria-label="Abrir informações de parceria"><span class="picon">🤝</span><span><b>FAZER PARCERIA</b><small>Colabora com a YunaMyst</small></span><strong>›</strong></a>\n'
          if 'id="yunaPartnershipButton"' not in s:
              wa_end = '</a>\n</section>'
              pos = s.find(wa_end, s.find('<a class="whats"'))
              if pos >= 0:
                  pos += len('</a>\n')
                  s = s[:pos] + mobile + s[pos:]
          css = '<style id="yuna-partnership-final-position">@media (min-width:851px){#yunaPartnershipButton{display:none!important}#yunaDesktopPartnershipButton{display:flex!important;margin:0 0 12px!important;width:100%!important;max-width:none!important}}@media (max-width:850px){#yunaPartnershipButton{display:flex!important;margin:0 auto 22px!important;width:100%!important;max-width:760px!important}#yunaDesktopPartnershipButton{display:none!important}}</style>'
          s = re.sub(r'<style id="yuna-partnership-final-position">[\s\S]*?</style>', '', s, flags=re.I)
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar somente se houve alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Corrigir parceria sem alterar códigos'
          git push origin HEAD:main
