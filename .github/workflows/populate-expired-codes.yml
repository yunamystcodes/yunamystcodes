name: Populate expired codes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add expired codes
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<div id="expiredCodesList"></div>'
          codes = [
            'MAYSW2026Z2Q','APRSW2026M08','LOTR4CO11ABON','SW03DEV06NOTE',
            'MARSW2026K61','26SWXLOTRS2','COL3KY8G1FT15','FEBSW2026E82',
            'OSAKAK1T3YA314','2026TEAMJPDARE','JANSW2026C13','1SURPR1SEG1FT',
            'SW25HSZN1223NQ','SW2025DEC9PJ','2NEWTOMORROW2'
          ]
          cards = ''.join(
            f'<article class="code expired" data-code="{c}">'
            f'<div class="gift">🗃️</div>'
            f'<div class="cinfo"><strong>{c}</strong><small>⛔ Código expirado</small></div>'
            f'<span style="grid-column:span 2;color:#9f96ad;font-size:11px;text-align:center">EXPIRADO</span>'
            f'</article>' for c in codes
          )
          replacement = f'<div id="expiredCodesList">{cards}</div>'
          if marker in s:
              s = s.replace(marker, replacement, 1)
          else:
              raise SystemExit('expiredCodesList marker not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add expired Summoners War codes"
          git push