name: Remove View All Codes Section

on:
  push:
    paths:
      - '.github/workflows/remove-more-section.yml'

permissions:
  contents: write

jobs:
  remove-more:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'class="more"'
          if old in s:
              import re
              s = re.sub(r'<div[^>]*class="more"[^>]*>.*?</div>', '', s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No change needed.'
          else
            git commit -m 'Remove view all codes section'
            git push
          fi
