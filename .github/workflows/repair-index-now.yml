name: Reparar HTML agora

on:
  push:
    paths:
      - ".github/workflows/repair-index-now.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir index diretamente e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
            from pathlib import Path
            p=Path('index.html')
            s=p.read_text(encoding='utf-8')
            replacements = {
              'Aqui encontras os <b>códigos ativos e expirados</b> de Summoners War: Sky Arena.': 'Aqui encontras os <b>códigos ativos</b> de Summoners War: Sky Arena.',
              'Aqui encontras os códigos ativos e expirados de Summoners War: Sky Arena.': 'Aqui encontras os códigos ativos de Summoners War: Sky Arena.',
              'códigos ativos e expirados': 'códigos ativos',
            }
            changed=False
            for old,new in replacements.items():
              if old in s:
                s=s.replace(old,new)
                changed=True
            p.write_text(s,encoding='utf-8')
            print('INDEX ALTERADO' if changed else 'INDEX JA CORRETO')
            PY
            if git diff --quiet -- index.html; then exit 0; fi
            git add index.html
            git commit -m "Atualizar texto do index sem expirados"
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard origin/main
            sleep 2
          done
          exit 1
