name: Sync YunaMyst logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-logo:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync embedded avatar with the uploaded logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          asset = Path('assets/yunamyst-mark.webp')
          script = Path('updates.js')
          if not asset.exists():
              raise SystemExit('assets/yunamyst-mark.webp not found')
          if not script.exists():
              raise SystemExit('updates.js not found')

          b64 = base64.b64encode(asset.read_bytes()).decode('ascii')
          data_uri = 'data:image/webp;base64,' + b64
          s = script.read_text(encoding='utf-8')
          pattern = r"var logoData='data:image/webp;base64,[^']*';"
          replacement = "var logoData='" + data_uri + "';"
          new_s, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit('Embedded logoData was not found in updates.js')
          script.write_text(new_s, encoding='utf-8')
          PY

      - name: Commit synchronized logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.js
          if git diff --cached --quiet; then echo "Logo already synchronized"; exit 0; fi
          git commit -m "Sincronizar logo YunaMyst [skip ci]"
          git push
