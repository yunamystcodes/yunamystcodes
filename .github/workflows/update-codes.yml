name: Atualizar códigos do Summoners War

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_codes.py"
      - "scripts/patch_index_layout.py"
      - ".github/workflows/update-codes.yml"
      - "assets/rewards/**"

permissions:
  contents: write

jobs:
  update-codes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Corrigir template das recompensas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/update_codes.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace("STYLE_PATCH = f'''", "STYLE_PATCH = '''")
          s = s.replace("text = text.replace('</style>', STYLE_PATCH + '</style>', 1)", "text = text.replace('</style>', STYLE_PATCH.replace('{{','{').replace('}}','}').replace('{REWARD_SPRITE}', REWARD_SPRITE) + '</style>', 1)")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Atualizar códigos
        run: python scripts/update_codes.py

      - name: Aplicar imagens e layout final das recompensas
        run: |
          python scripts/patch_index_layout.py
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          patch = r'''
