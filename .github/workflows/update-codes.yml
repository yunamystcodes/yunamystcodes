name: Atualizar códigos do Summoners War

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_codes.py"
      - ".github/workflows/update-codes.yml"
      - "assets/rewards/**"

permissions:
  contents: write

jobs:
  update-codes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Corrigir template das recompensas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/update_codes.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace("STYLE_PATCH = f'''", "STYLE_PATCH = '''")
          s = s.replace("text = text.replace('</style>', STYLE_PATCH + '</style>', 1)", "text = text.replace('</style>', STYLE_PATCH.replace('{{','{').replace('}}','}').replace('{REWARD_SPRITE}', REWARD_SPRITE) + '</style>', 1)")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Atualizar códigos
        run: python scripts/update_codes.py

      - name: Aplicar imagens reais das recompensas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          patch = '''
          /* Imagens reais enviadas para as recompensas */
          .reward-img{background-image:none!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important;width:32px!important;height:32px!important;display:inline-block!important}
          .reward-mystic{background-image:url("assets/rewards/mystic.svg")!important}
          .reward-fire{background-image:url("assets/rewards/fire.svg")!important}
          .reward-water{background-image:url("assets/rewards/water.svg")!important}
          .reward-wind{background-image:url("assets/rewards/wind.svg")!important}
          .reward-mana{background-image:url("assets/rewards/mana.svg")!important}
          .reward-crystal{background-image:url("assets/rewards/crystal.svg")!important}
          @media(max-width:600px){.reward-img{width:30px!important;height:30px!important}}
          '''
          s = s.replace("</style>", patch + "</style>", 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Guardar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/rewards .github/workflows/update-codes.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos códigos."
          else
            git commit -m "Corrigir icones das recompensas"
            git push
          fi
