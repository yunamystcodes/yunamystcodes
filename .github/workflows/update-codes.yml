name: Atualizar códigos do Summoners War

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/auto_update_codes_fixed.py"
      - ".github/workflows/update-codes.yml"
      - "updates.js"
      - "index.html"

permissions:
  contents: write

jobs:
  update-codes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Atualizar códigos usando as 6 fontes
        run: python scripts/auto_update_codes_fixed.py

      - name: Garantir 8 códigos ativos visíveis no PC e no telemóvel
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("var visibleCount=4;", "var visibleCount=8;")
          s = s.replace("var visibleCount = 4;", "var visibleCount = 8;")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Corrigir texto da parceria no PC e no telemóvel
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("Colabora com o YunaMyst Codes", "Colabora com a YunaMyst")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Restaurar visual original da barra superior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          black = '.topbar{position:sticky;top:0;z-index:20;background:#000 !important;backdrop-filter:none;border-bottom:1px solid rgba(255,255,255,.12)}'
          original = '.topbar{position:sticky;top:0;z-index:20;background:rgba(5,4,13,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.12)}'
          s = s.replace(black, original, 1)
          p.write_text(s, encoding="utf-8")
          print("Visual original da barra superior restaurado")
          PY

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/code_history.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos códigos."
          else
            git commit -m "Restaurar barra e cabeçalho ao visual anterior"
            git pull --rebase origin main
            git push
          fi
