name: Atualizar códigos do Summoners War

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_codes.py"

permissions:
  contents: write

jobs:
  update-codes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Atualizar códigos
        run: python scripts/update_codes.py

      - name: Guardar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos códigos."
          else
            git commit -m "Atualizar códigos do Summoners War"
            git push
          fi
