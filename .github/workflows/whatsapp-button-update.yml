name: One-time WhatsApp button update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update WhatsApp button
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.whats{margin:25px auto 22px;max-width:760px;display:flex;align-items:center;gap:14px;text-align:left;padding:11px 17px;border-radius:18px;text-decoration:none;color:#fff;background:linear-gradient(90deg,rgba(20,8,40,.96),rgba(34,13,57,.96));border:1px solid #a85cff;box-shadow:0 0 28px rgba(168,92,255,.18)}.wicon{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#25d366;color:#fff;font-size:28px;font-weight:900;flex:none}.wicon svg{width:32px;height:32px;display:block}'
          new = '.whats{margin:25px auto 22px;max-width:760px;display:flex;align-items:center;gap:14px;text-align:left;padding:11px 17px;border-radius:18px;text-decoration:none;color:#fff;background:linear-gradient(90deg,rgba(8,7,22,.98),rgba(16,10,29,.98));border:1px solid #25d366;box-shadow:0 0 28px rgba(37,211,102,.18)}.wicon{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:transparent;color:#25d366;font-size:28px;font-weight:900;flex:none}.wicon svg{width:42px;height:42px;display:block;filter:drop-shadow(0 0 5px rgba(37,211,102,.35))}'
          if old not in s:
              raise SystemExit('Expected WhatsApp CSS was not found; no changes made.')
          s = s.replace(old, new, 1)
          s = s.replace('.wicon{width:48px;height:48px;font-size:26px}', '.wicon{width:48px;height:48px;font-size:26px}.wicon svg{width:40px;height:40px}', 1)
          s = s.replace('.wicon{width:46px;height:46px;font-size:24px}', '.wicon{width:46px;height:46px;font-size:24px}.wicon svg{width:38px;height:38px}', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit index and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/whatsapp-button-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/whatsapp-button-update.yml
          git commit -m 'Update WhatsApp button icon for PC and mobile'
          git push
