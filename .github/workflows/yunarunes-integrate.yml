name: Integrar YunaRunes no site
on:
  push:
    paths:
      - 'yunarunes.css'
      - 'yunarunes.js'
      - '.github/workflows/yunarunes-integrate.yml'
      - 'index.html'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject YunaRunes assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="yunarunes.css">'
          js='<script src="yunarunes.js" defer></script>'
          if css not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          if js not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Integrar YunaRunes no site'
          git push
